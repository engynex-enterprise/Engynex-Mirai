# Prometheus LOCAL (perfil `metrics` de compose.yaml): lee las métricas que el colector expone en otel-collector:8889.
# Las consultas del panel base (dashboards/mirai-base.json) son PromQL: sirven igual aquí, en Managed Service for
# Prometheus (GCP), Amazon Managed Prometheus o Azure Monitor managed Prometheus.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: otel-collector
    # Respeta job/instance que pone el exportador (job = mirai/mirai-api…), igual que Managed Prometheus en GCP.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
