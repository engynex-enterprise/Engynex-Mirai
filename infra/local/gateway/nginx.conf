# Hace de Kong (perfil "supa"): la superficie HTTP de Supabase que usa supabase-js, en http://localhost:55421.
#   /auth/v1/*     → GoTrue      /rest/v1/*   → PostgREST      /storage/v1/*  → storage-api
#   /realtime/v1/* → no existe aquí: la E2E local usa el gateway socket.io de la API (NEXT_PUBLIC_LIVE_SOURCE=gateway).
# CORS lo pone nginx (como Kong) para que el navegador de la E2E pueda hablarle desde http://localhost:55300.
worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 60m;
  proxy_read_timeout 120s;
  access_log off;

  map $http_origin $cors_origin { default $http_origin; "" "*"; }

  server {
    listen 8000;

    set $auth http://supa-auth:9999;
    set $rest http://supa-rest:3000;
    set $storage http://supa-storage:5000;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Location, X-Total-Count, X-Supabase-Api-Version" always;

    if ($request_method = OPTIONS) { return 204; }

    location /auth/v1/ {
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass $auth;
    }

    location /rest/v1/ {
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_pass $rest;
    }

    location /storage/v1/ {
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Prefix /storage/v1;
      proxy_pass $storage;
    }

    location = /healthz { return 200 "ok\n"; }
    location / { return 404 "No existe en el Supabase local de Mirai\n"; }
  }
}
