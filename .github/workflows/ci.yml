# CI de Mirai (F2-A-7 y V7-N, docs/arquitectura/v7-gcp-total.md §3.12). GitHub Actions es el CI/CD principal; Cloud
# Build (infra/cloudbuild/*) queda como alternativa con los mismos pasos.
# - En cada PR y push a pruebas/main: lint, typecheck, Vitest y build con Turborepo (caché local de turbo en Actions).
# - Infraestructura: terraform fmt, prueba de contrato entre nubes, validate de las 9 raíces (GCP, AWS, Azure ×
#   bootstrap/pruebas/produccion), terraform test con proveedores simulados, actionlint y bash -n de los scripts.
# - Cuando este flujo termina en verde por un push a la rama de producción (v6), desplegar-vps.yml despliega en el VPS
#   con Dokploy. deploy.yml (GCP/AWS/Azure) no hace nada mientras no exista MIRAI_CLOUD.
# - E2E (Playwright): en el computador, contra el stack local en Docker (pnpm e2e:local; infra/local/README.md). Las
#   pruebas preparan datos directo en la base local, así que no corren contra un despliegue.
name: CI

on:
  pull_request:
  push:
    branches: [v6, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Bogota
      # La web compila sin secretos (solo NEXT_PUBLIC_*). Marcadores para las pruebas de la API y los paquetes.
      NEXT_PUBLIC_SITE_URL: https://mirai.engynex.com
      ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtYmFzZTY0LXh4eA==
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # usa "packageManager" de package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # Las pruebas de paridad con la v4 compilan legacy/dist/app.check.js con python3 (viene en el runner).
      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      - name: Formato
        run: terraform fmt -check -recursive infra/terraform
      - name: Contrato entre nubes (mismas entradas y salidas)
        run: python3 infra/terraform/scripts/contrato.py
      - name: Validar las raíces de cada nube (sin backend ni credenciales)
        run: |
          set -euo pipefail
          for r in infra/terraform/clouds/*/envs/*; do
            echo "::group::$r"
            terraform -chdir="$r" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$r" validate
            echo "::endgroup::"
          done
      - name: Pruebas con proveedores simulados
        run: |
          set -euo pipefail
          for d in infra/terraform/capabilities/app-config infra/terraform/clouds/gcp/stack infra/terraform/clouds/aws/stack infra/terraform/clouds/azure/stack; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" test
            echo "::endgroup::"
          done
      - name: Flujos de GitHub Actions (actionlint)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Scripts de despliegue (bash -n)
        run: for f in infra/deploy/*/*.sh infra/cloudbuild/scripts/*.sh; do bash -n "$f"; done
