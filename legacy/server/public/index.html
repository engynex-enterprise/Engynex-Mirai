function onAutoInput(el){const form=el.closest('form');if(!form)return;const isG=form.dataset.form==='gasto';const desc=fv(form,el.name==='desc'||el.name==='nombre'?el.name:(isG?'desc':'nombre'));

    if(needCat&&r.cat&&!(r.cat==='Otros'&&localCat(desc))&&form.dataset.catManual!=='1'){setSelValue(form,'cat',r.cat);autoCatHint(form,`<span class="pill vio">${ic('sparkles')}Categoría sugerida por IA</span>`)}
    if(isG&&r.hormiga!==null){form.dataset.aiH=r.hormiga?'1':'0';form.dataset.aiR=r.razon;updHormigaHint(form)}},750)}
function updHormigaHint(form){const h=form.querySelector('#hHint');if(!h)return;const mode=fv(form,'hormigaMode');const v=fv(form,'valor');

let AIQ=[],AIT=null;
function queueHormiga(g){if(!S.cfg.ia.hormiga||g.hormigaSrc==='manual'||g.fijoId)return;AIQ.push(g.id);clearTimeout(AIT);AIT=setTimeout(flushHormiga,400)}
async function flushHormiga(){const ids=AIQ.splice(0,40);const items=ids.map(id=>S.gastos.find(g=>g.id===id)).filter(Boolean);if(!items.length)return;const res=await aiClassify(items);if(!res)return;let n=0;
  res.forEach(r=>{const g=items[r.i];if(!g||g.hormigaSrc==='manual'||r.hormiga===null)return;g.hormiga=r.hormiga;g.hormigaSrc='ia';g.hormigaRazon=r.razon;if(r.hormiga)n++});commit();softRender();if(AIQ.length)flushHormiga();return n}
async function reviewMonth(k){const items=gastosMesK(k).filter(g=>!g.fijoId&&g.hormigaSrc!=='manual'&&g.hormigaSrc!=='ia');if(!items.length){toast('Todos los gastos de este mes ya están revisados');return}
  toast(`La IA está revisando ${items.length} gastos…`);let total=0,ok=false;for(let i=0;i<items.length;i+=40){const part=items.slice(i,i+40);const res=await aiClassify(part);if(!res)break;ok=true;res.forEach(r=>{const g=part[r.i];if(!g||r.hormiga===null)return;g.hormiga=r.hormiga;g.hormigaSrc='ia';g.hormigaRazon=r.razon;if(r.hormiga)total++})}

async function classifyImport(){if(!IMP||!IMP.rows)return;IMP.rows.forEach(r=>{if(r.cat==='Otros'){const lc=localCat(r.desc);if(lc)r.cat=lc.cat}r.hormiga=localHormiga({desc:r.desc,valor:r.valor,cat:r.cat})});

let CONS={last:null,loading:false};
function gastosBasicos(){return fijosMes()+cuotasMes('pagar')+subsMes()+S.cfg.categorias.filter(c=>c.grupo==='n'&&!fijoCats().has(c.nombre.toLowerCase())).reduce((a,c)=>a+ +c.tope,0)}
function analizar(d){const ing=ingresoMensual(),fij=fijosMes(),cuo=cuotasMes('pagar'),subs=subsMes(),varr=gastoVariableReal(),libre=ing-fij-cuo-subs-varr,liq=liquidez(),bas=gastosBasicos()||1;
  const valor=+d.valor||0,n=Math.max(1,+d.cuotas||1);let cuota=0,total=valor,intereses=0,ea=0,tasaM=0;
  const enCuotas=d.tipo==='credito'||d.tipo==='prestar'||(d.tipo==='comprar'&&d.forma==='cuotas');
  if(enCuotas){if(d.modoInt==='tasa'){tasaM=+d.tasa||0;cuota=annuity(valor,tasaM/100,n)}else if(d.modoInt==='cuota'){cuota=+d.cuotaV||0;tasaM=rateFromCuota(valor,cuota,n,'mensual')}else cuota=valor/n;total=cuota*n;intereses=Math.max(total-valor,0);ea=Math.pow(1+tasaM/100,12)-1}
  let libreD=libre,ratioD=ing?cuo/ing:0,liqD=liq;

let S=null;const SYNC={cls:'local',t:'Solo en este navegador',s:'Conectando con la nube…'};
const CLOUD={db:null,canWrite:true,estadoExists:false,lastEst:'',lastMonths:{},timer:null,writing:false,again:false,dirty:false,pend:false,gastosSnap:null};
function setSync(cls,t,s){SYNC.cls=cls;SYNC.t=t;SYNC.s=s;const p=document.getElementById('syncP'),q=document.getElementById('syncS');if(p){p.className='syncp '+cls;p.textContent=t}if(q)q.textContent=s}
function commit(){store.set(LKEY(),S);scheduleCloud()}
function scheduleCloud(){CLOUD.deleted=false;if(!CLOUD.db||!CLOUD.canWrite||S.sample)return;CLOUD.dirty=true;CLOUD.pend=true;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(flushCloud,700)}
async function flushCloud(){if(CLOUD.writing){CLOUD.again=true;return}CLOUD.writing=true;CLOUD.pend=false;setSync('cloud','Sincronizando…','Guardando cambios');
  try{const est=clone(S);delete est.gastos;const j=JSON.stringify(est);if(j!==CLOUD.lastEst){await CLOUD.db.doc(P_EST()).set({...est,updatedAt:Date.now()});CLOUD.lastEst=j;CLOUD.estadoExists=true}
    const by={};S.gastos.forEach(g=>{const k=g.fecha.slice(0,7);(by[k]=by[k]||[]).push(g)});for(const k of new Set([...Object.keys(by),...Object.keys(CLOUD.lastMonths)])){const jj=JSON.stringify(by[k]||[]);if(jj===CLOUD.lastMonths[k])continue;if(by[k]&&by[k].length){await CLOUD.db.doc(P_G()+'/'+k).set({items:by[k]});CLOUD.lastMonths[k]=jj}else{await CLOUD.db.doc(P_G()+'/'+k).delete();delete CLOUD.lastMonths[k]}}
    setSync('cloud','Guardado en la nube','Se sincroniza con quienes compartas el libro.')}
  catch(e){if(/permission|not_granted|forbidden/i.test((e&&e.code||'')+(e&&e.message||''))){CLOUD.canWrite=false;setSync('err','Solo lectura','No tienes permiso para editar. Tus cambios quedan en este navegador.')}else setSync('err','Sin sincronizar','No se pudo guardar en la nube. Se reintentará con el próximo cambio.')}
  CLOUD.writing=false;if(CLOUD.again){CLOUD.again=false;flushCloud()}else CLOUD.dirty=!!CLOUD.pend}
let pendingRender=false;
const typing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('main,#modal')&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='hidden'&&a.type!=='checkbox'};

function applyCloud(){if(!CLOUD.estadoExists)return;if(CLOUD.gastosSnap)S.gastos=CLOUD.gastosSnap;store.set(LKEY(),S);softRender()}
async function bootCloud(){let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(!db){setSync('local','Solo en este navegador','La nube no está disponible en esta vista. Exporta respaldos desde Ajustes.');return}
  CLOUD.db=db;let loaded=false;const to=setTimeout(()=>{if(!loaded)setSync('err','Sin conexión','No se pudo leer la nube todavía. Trabajas con la copia local.')},10000);
  db.doc(P_EST()).onSnapshot(snap=>{if(!snap.metadata.fromCache){loaded=true;clearTimeout(to)}
    if(snap.exists){if(snap.metadata.hasPendingWrites||CLOUD.dirty||CLOUD.writing)return;const data=clone(snap.data());delete data.updatedAt;const j=JSON.stringify(data);CLOUD.estadoExists=true;
      if(j!==CLOUD.lastEst){CLOUD.lastEst=j;const g=S.gastos;S=normalize({...data,gastos:g});if(data.v!==3){CLOUD.lastEst='';scheduleCloud()}applyCloud();maybePopups()}
      setSync('cloud','Guardado en la nube','Se sincroniza con quienes compartas el libro.')}
    else if(!snap.metadata.fromCache){CLOUD.estadoExists=false;if(CLOUD.deleted)setSync('local','Cuenta eliminada','Tus datos se borraron. Empieza de nuevo cuando quieras.');else if(S.sample)setSync('local','Ejemplo sin guardar','Empieza tu libro para guardarlo en la nube.');else{flushCloud()}}
  },()=>{clearTimeout(to);setSync('err','Sin conexión','La nube no respondió. Trabajas con la copia local.')});
  db.collection(P_G()).onSnapshot(qs=>{if((qs.metadata&&qs.metadata.hasPendingWrites)||CLOUD.dirty||CLOUD.writing)return;const items=[];qs.docs.forEach(d=>{const b=d.data();CLOUD.lastMonths[d.id]=JSON.stringify(b.items||[]);(b.items||[]).forEach(x=>items.push({...x}))});CLOUD.gastosSnap=items.map(x=>({...x,quien:x.quien||'familia'}));applyCloud()},()=>{})}

function cortesDesde(t,fecha,hasta){const c=+t.corte||25;let n=0;let d=parse(fecha);let cur=new Date(d.getFullYear(),d.getMonth(),Math.min(c,lastDay(d.getFullYear(),d.getMonth())));if(cur<=d)cur=new Date(d.getFullYear(),d.getMonth()+1,Math.min(c,lastDay(d.getFullYear(),d.getMonth()+1)));while(cur<=hasta&&n<600){n++;cur=new Date(cur.getFullYear(),cur.getMonth()+1,Math.min(c,lastDay(cur.getFullYear(),cur.getMonth()+1)))}return n}
function compraEstado(t,c,hasta=today()){const n=Math.max(1,+c.cuotas||1),i=n>1?(+t.tasa||0)/100:0;const cuota=annuity(+c.valor,i,n);let k=c.pagada?n:Math.min(cortesDesde(t,c.fecha,hasta),n);let saldo=+c.valor;for(let j=0;j<k;j++){const int=saldo*i;saldo=Math.max(0,saldo-(cuota-int))}if(c.pagada)saldo=0;return{cuota,n,k,saldo,int:cuota*n-c.valor,pendiente:k<n&&!c.pagada}}
function tarjetaPagoMes(t,offset=0){const ref=addMonths(today(),offset);return (t.compras||[]).reduce((a,c)=>{const e=compraEstado(t,c,ref);return a+(e.pendiente?e.cuota:0)},0)}

/* ---------------- 12. Registrar escribiendo en palabras ---------------- */
function parseNL(t){const s=norm(t);let v=0;const m=s.match(/(\d+(?:[\.,]\d+)*)\s*(mil|k|lucas|millones|millon|palos|m\b)?/);if(m){let n=pnum(m[1]);const u=m[2]||'';if(/mil|k|lucas/.test(u))n*=1000;else if(/millon|palos|^m$/.test(u))n*=1e6;else if(n<1000&&/mil/.test(s))n*=1000;v=n}
  let f=today();if(/anteayer|antier/.test(s))f=addDays(f,-2);else if(/ayer/.test(s))f=addDays(f,-1);const dias=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];dias.forEach((d,i)=>{if(new RegExp('el '+d).test(s)){let x=today();while(x.getDay()!==i)x=addDays(x,-1);f=x}});
  const ingreso=/(me pagaron|recibi|me consignaron|me llego|cobre|ingreso|gane|vendi)/.test(s);let desc=t.replace(/(gast[eé]|pagu[eé]|compr[eé]|me pagaron|recib[ií]|me consignaron|cobr[eé])\s*/i,'').replace(/\$?\s*\d+(?:[\.,]\d+)*\s*(mil|k|lucas|millones|millón|millon|palos)?/i,'').replace(/\b(hoy|ayer|anteayer|antier|el (lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo))\b/ig,'').replace(/^\s*(en|de|por|un|una)\s+/i,'').replace(/\s+/g,' ').trim();
  return{tipo:ingreso?'ingreso':'gasto',valor:Math.round(v),fecha:iso(f),desc:desc?desc[0].toUpperCase()+desc.slice(1):''}}
EXTRA_FORM.nl=async(d,f)=>{const t=String(d.texto||'').trim();if(!t)return false;let r=parseNL(t);const btn=f.querySelector('button');btn.disabled=true;btn.innerHTML=`${ic('sparkles')}Entendiendo…`;
  const sample=await useCap('sample');if(sample){try{const a=await sample.json(`Interpreta lo que escribió una persona colombiana para registrar un movimiento de dinero. Hoy es ${iso(today())}. Texto: "${t}". Categorías de gasto: ${S.cfg.categorias.map(c=>c.nombre).join(', ')}. Responde SOLO JSON {"tipo":"gasto"|"ingreso","valor":12345,"descripcion":"corta","fecha":"YYYY-MM-DD","categoria":"una de la lista o null"}. "mil"=x1000, "lucas"=x1000, "palos"=millones.`,{modelTier:'quick'});if(+a.valor)r={tipo:a.tipo==='ingreso'?'ingreso':'gasto',valor:Math.round(+a.valor),fecha:/^\d{4}-\d\d-\d\d$/.test(a.fecha)?a.fecha:r.fecha,desc:a.descripcion||r.desc,cat:catOf(a.categoria)?.nombre}}catch(e){}}
  btn.disabled=false;f.reset();if(!r.valor){toast('No entendí el valor. Prueba: "gasté 15 mil en almuerzo"');render();return false}
  if(r.tipo==='ingreso'){openModal('extra',{desc:r.desc,valor:r.valor,fecha:r.fecha})}else openModal('gasto',{desc:r.desc,valor:r.valor,fecha:r.fecha,cat:r.cat||localCat(r.desc)?.cat||''});return false};
M.extra=(ds={})=>({t:'Registrar ingreso extra',b:`<form id="mform" data-form="extra" class="form">${field('¿De qué fue?',txt('desc',ds.desc||'',{req:true,ph:'Ej. Venta de bicicleta'}),{cls:'full'})}${field('Valor',money('valor',ds.valor||'',{req:true}))}${field('Fecha',datep('fecha',ds.fecha||iso(today())))}<p class="note full">Los ingresos extra suman en tu quincena y en el flujo de caja, pero no se repiten como el salario.</p></form>`,f:`<button class="btn" data-act="mclose">Cancelar</button><button class="btn pri" form="mform">${ic('check')}Guardar</button>`});

/* ---------------- 13. Resumen del mes con IA ---------------- */
async function resumenIA(k){const sample=await useCap('sample');const [yy,mm]=k.split('-').map(Number);const prevK=mkey(new Date(yy,mm-2,1));const by=kk=>{const o={};gastosMesK(kk).forEach(g=>o[g.cat]=(o[g.cat]||0)+ +g.valor);return o};const a=by(k),b=by(prevK);
  const data={mes:`${MESL[mm-1]} ${yy}`,ingreso_mensual:Math.round(ingresoMensual()),gastos_por_categoria:a,mes_anterior:b,total:Math.round(Object.values(a).reduce((x,y)=>x+y,0)),total_anterior:Math.round(Object.values(b).reduce((x,y)=>x+y,0)),hormiga:Math.round(gastosMesK(k).filter(isHormiga).reduce((x,g)=>x+ +g.valor,0)),topes_excedidos:S.cfg.categorias.filter(c=>c.tope&&(a[c.nombre]||0)>c.tope).map(c=>c.nombre),deudas_saldo:Math.round(totales().xp+tarjetasDeuda()),metas:S.metas.map(m=>({nombre:m.nombre,avance:Math.round(m.ahorrado/m.objetivo*100)}))};
  if(!sample){const top=Object.entries(a).sort((x,y)=>y[1]-x[1]).slice(0,3);return{titular:`Gastaste ${$(data.total)} en ${data.mes}`,resumen:`Comparado con el mes anterior (${$(data.total_anterior)}), ${data.total>data.total_anterior?'gastaste más':'gastaste menos'}.`,gastaste_mas:top.map(([c,v])=>`${c}: ${$(v)}`),mejoro:[],alertas:data.topes_excedidos.map(c=>`Te pasaste del tope en ${c}`),recomendacion:'Abre el libro en claude.ai para recibir un análisis completo con IA.',local:true}}
  const r=await sample.json(`Eres un asesor financiero cercano para una familia colombiana. Haz un resumen del mes en español sencillo, con cifras en formato $ 1.234.567. Responde SOLO JSON {"titular":"máx 12 palabras","resumen":"2-3 frases","gastaste_mas":["3 puntos"],"mejoro":["1-3 puntos"],"alertas":["0-3 puntos"],"recomendacion":"una acción concreta para el próximo mes"}.\nDATOS: ${JSON.stringify(data)}`,{modelTier:'default'});return r}

const RETOS_T=[{k:'domis',tipo:'sin_cat',cat:'Domicilios',dias:30,n:'30 días sin domicilios',icon:'bike',d:'Cocina en casa o recoge tú mismo. Ahorro típico: $ 150.000 al mes.'},{k:'hormiga',tipo:'sin_hormiga',dias:7,n:'Una semana sin gastos hormiga',icon:'coffee',d:'Nada de tintos, snacks ni antojos durante 7 días.'},{k:'rest',tipo:'sin_cat',cat:'Restaurantes',dias:30,n:'Un mes sin restaurantes',icon:'utensils',d:'Lleva almuerzo y prepara comidas especiales en casa.'},{k:'52',tipo:'semanas',dias:364,base:5000,n:'Reto de las 52 semanas',icon:'piggy-bank',d:'Semana 1 ahorras $ 5.000, semana 2 $ 10.000… Al final tendrás $ 6.890.000.'},{k:'diario',tipo:'diario',dias:30,base:10000,n:'Ahorra $ 10.000 diarios por un mes',icon:'coins',d:'Al final del mes tendrás $ 300.000.'}];
function retoEstado(r){const t=today(),ini=parse(r.inicio),dd=Math.min(days(ini,t)+1,r.dias);if(r.tipo==='sin_cat'||r.tipo==='sin_hormiga'){const f=S.gastos.filter(g=>g.fecha>=r.inicio&&(r.tipo==='sin_hormiga'?isHormiga(g):norm(g.cat)===norm(r.cat))).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];if(f)return{prog:days(ini,parse(f.fecha))/r.dias,fallo:f,txt:`Se rompió el ${fdate(parse(f.fecha))} (${esc(f.desc)})`};return{prog:dd/r.dias,ok:dd>=r.dias,txt:dd>=r.dias?'¡Reto cumplido!':`Llevas ${dd} de ${r.dias} días`}}
  const hechos=(r.marcas||[]).length,total=r.tipo==='semanas'?52:r.dias,ahorro=r.tipo==='semanas'?(r.marcas||[]).reduce((a,w)=>a+w*r.base,0):hechos*r.base;return{prog:hechos/total,ok:hechos>=total,txt:`${hechos} de ${total} ${r.tipo==='semanas'?'semanas':'días'} · ahorrado ${$(ahorro)}`,ahorro}}

  <div class="card"><h2>Elige un reto</h2><div class="choices">${RETOS_T.map(t=>`<button type="button" class="choice" data-act="retoNew" data-k="${t.k}"><span class="ci t-green">${ic(t.icon)}</span><div><b>${t.n}</b><span>${t.d}</span></div></button>`).join('')}</div></div>

    ${e.fallo?`<button class="btn soft sm" data-act="retoReset" data-id="${r.id}">${ic('refresh-cw')}Volver a empezar desde hoy</button>`:''}

    ${r.tipo==='diario'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri sm" data-act="retoMark" data-id="${r.id}" data-w="${iso(today())}" ${r.marcas?.includes(iso(today()))?'disabled':''}>${ic('check')}${r.marcas?.includes(iso(today()))?'Hoy ya ahorraste':'Hoy ahorré '+$(r.base)}</button></div>`:''}</div>`}).join('')}</section>`;

const TOUR=[{sel:'#side',t:'El menú',d:'Aquí están todas las secciones, agrupadas. Toca un grupo para ver sus opciones. Lo puedes contraer con Ctrl+B.'},{sel:'.sb-brand',t:'Tus libros',d:'Cambia entre tus libros (por ejemplo, el hogar y tu negocio) o crea uno nuevo.'},{sel:'.sb-search',t:'Buscador',d:'Encuentra secciones, contactos, préstamos o gastos fijos escribiendo su nombre. Atajo: Ctrl+K.'},{sel:'#crumbs',t:'Dónde estás',d:'Esta ruta te muestra en qué libro y sección te encuentras.'},{sel:'.composer',t:'Registra en palabras',d:'En Inicio escribe lo que gastaste o recibiste, como lo dirías: la IA lo entiende y lo registra.'},{sel:'.sb-create',t:'Agregar',d:'Registra rápidamente un gasto, ingreso, préstamo, deuda, contacto, inversión o meta.'},{sel:'#bell',t:'Notificaciones',d:'Te avisamos de pagos por vencer, cobros atrasados, gastos hormiga y más.'},{sel:'.sb-tog',t:'Contraer el menú',d:'Hazlo más angosto para ganar espacio (Ctrl+B). Ocultar montos y el tema oscuro están en tu menú de usuario, abajo.'},{sel:'#asFab',t:'Chat con Mirai',d:'Este globo abre el chat: pregunta lo que quieras sobre tu plata. Lo puedes arrastrar a donde te estorbe menos.'},{sel:'.sb-user',t:'Tu menú',d:'Perfil, ajustes, tema oscuro, respaldo y la puesta en marcha.'},{sel:'.page-h .help-btn',t:'Cómo funciona',d:'En cada sección encontrarás este botón con el paso a paso para usarla.'}];
let TI=-1;
function tourShow(){let el=null;while(TI<TOUR.length){el=document.querySelector(TOUR[TI].sel);if(el&&el.offsetParent!==null)break;TI++}if(TI>=TOUR.length){tourEnd();return}
  let ov=document.getElementById('tour');if(!ov){ov=document.createElement('div');ov.id='tour';document.body.appendChild(ov)}const r=el.getBoundingClientRect(),s=TOUR[TI];const pad=6;
  const boxW=Math.min(320,window.innerWidth-24);let left=r.right+14,top=r.top;if(left+boxW>window.innerWidth-12){left=Math.max(12,Math.min(r.left,window.innerWidth-boxW-12));top=r.bottom+14}if(top+190>window.innerHeight)top=Math.max(12,r.top-200);
  ov.innerHTML=`<div class="tour-ring" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${Math.min(r.height+pad*2,window.innerHeight-20)}px"></div><div class="tour-card" role="dialog" style="left:${left}px;top:${top}px;width:${boxW}px"><div class="lbl-s">Paso ${TI+1} de ${TOUR.length}</div><h3 style="margin:2px 0 6px;font-size:17px">${s.t}</h3><p style="margin:0 0 12px;font-size:14px;color:var(--muted)">${s.d}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm ghost" data-act="tourEnd">Saltar</button>${TI>0?`<button class="btn sm" data-act="tourPrev">Anterior</button>`:''}<button class="btn sm pri" data-act="tourNext">${TI===TOUR.length-1?'Terminar':'Siguiente'}</button></div></div>`}
function tourEnd(){TI=-1;document.getElementById('tour')?.remove();store.set('lmf-tour',1)}
EXTRA_ACT.tourStart=()=>{closeModal();closePop();if(window.innerWidth<=820&&!document.body.classList.contains('nav-open')){}document.body.classList.remove('sb-col');renderNav(view());TI=0;window.scrollTo(0,0);setTimeout(tourShow,120)};
EXTRA_ACT.tourNext=()=>{TI++;tourShow()};EXTRA_ACT.tourPrev=()=>{TI=Math.max(0,TI-1);while(TI>0&&!document.querySelector(TOUR[TI].sel))TI--;tourShow()};EXTRA_ACT.tourEnd=()=>tourEnd();
window.addEventListener('resize',()=>{if(TI>=0)tourShow()});

const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function pbkdf2(pass,salt,iter=210000){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:iter},k,256))}
const sha256=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){let bits='',out='';bytes.forEach(b=>bits+=b.toString(2).padStart(8,'0'));for(let i=0;i<bits.length;i+=5)out+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return out}
function b32dec(s){let bits='';s.replace(/=+$/,'').toUpperCase().split('').forEach(c=>{const v=B32.indexOf(c);if(v>=0)bits+=v.toString(2).padStart(5,'0')});const out=[];for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(out)}
async function totp(secret,t=Date.now()){const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const ctr=Math.floor(t/30000);const msg=new ArrayBuffer(8);const dv=new DataView(msg);dv.setUint32(0,Math.floor(ctr/2**32));dv.setUint32(4,ctr>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,msg));const o=h[h.length-1]&15;const code=((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6;return String(code).padStart(6,'0')}
async function verifyTotp(secret,code){code=String(code).replace(/\D/g,'');for(const w of[-1,0,1])if(await totp(secret,Date.now()+w*30000)===code)return true;return false}
function pwScore(p){let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;if(p.length>=12)s++;return Math.min(4,s)}
const pwReqs=p=>[[p.length>=8,'Mínimo 8 caracteres'],[/[A-Z]/.test(p)&&/[a-z]/.test(p),'Mayúsculas y minúsculas'],[/\d/.test(p),'Al menos un número'],[/[^A-Za-z0-9]/.test(p),'Al menos un símbolo (!, #, *…)']];
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e).trim());

/* ---- almacenamiento de la cuenta (privado para cada persona) ---- */
const AUTH={acc:null,ready:false,mode:'local',ref:null,view:'loading',tmp:{},err:'',busy:false};
async function loadAccount(){const user=await useCap('user'),db=await useCap('db');let uid=null;try{uid=user?await user.id():null}catch(e){}
  if(db&&uid){try{AUTH.ref=db.collection('data/users/'+uid).doc('cuenta');const s=await AUTH.ref.get();AUTH.mode='nube';AUTH.acc=s.exists?clone(s.data()):null;if(AUTH.acc)store.set('nido-tiene-cuenta',1);return}catch(e){AUTH.ref=null}}
  AUTH.mode='local';AUTH.acc=store.get('nido-cuenta',null)}
async function saveAccount(){if(AUTH.ref){try{await AUTH.ref.set(AUTH.acc);store.set('nido-tiene-cuenta',1);return}catch(e){}}store.set('nido-cuenta',AUTH.acc)}
const SKEY='nido-sesion';
function sesGet(){let s=null;try{s=JSON.parse(sessionStorage.getItem(SKEY)||'null')}catch(e){}if(!s)s=store.get(SKEY,null);if(!s||!AUTH.acc||s.k!==AUTH.acc.hash.slice(0,16)||Date.now()>s.exp)return null;return s}
function sesSet(rem){const s={k:AUTH.acc.hash.slice(0,16),exp:Date.now()+(rem?30*864e5:12*36e5),rem};try{sessionStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}if(rem)store.set(SKEY,s);else{try{localStorage.removeItem(SKEY)}catch(e){}}}
function sesClear(){try{sessionStorage.removeItem(SKEY);localStorage.removeItem(SKEY)}catch(e){}}

 recuperar:()=>{const a=AUTH.acc;const ops=[];if(a?.totp?.on)ops.push(['app','ajustes','Código de mi app de autenticación','El que aparece en Google o Microsoft Authenticator.']);if(a?.backup?.some(b=>!b.used))ops.push(['backup','renta','Un código de respaldo','Los que guardaste al activar la verificación en dos pasos.']);if(a?.email)ops.push(['email','correo','Un código a mi correo',`Te lo enviamos a ${esc(maskEmail(a.email))}.`]);if(AUTH.mode==='nube')ops.push(['claude','perfil','Confirmar con mi sesión de Claude','Tu cuenta de Mirai está guardada de forma privada en tu cuenta de Claude, así que podemos confirmar que eres tú.']);

async function genCodes(){const codes=Array.from({length:8},()=>{const r=b32enc(rnd(5)).slice(0,8);return r.slice(0,4)+'-'+r.slice(4)});AUTH.acc.backup=await Promise.all(codes.map(async c=>({h:await sha256(c),used:false})));return codes}
async function useBackup(code){const h=await sha256(String(code).trim().toUpperCase());const b=(AUTH.acc.backup||[]).find(x=>x.h===h&&!x.used);if(!b)return false;b.used=true;await saveAccount();return true}
async function sendEmailCode(){const code=String(Math.floor(100000+Math.random()*900000));AUTH.tmp.emailCode=await sha256(code);AUTH.tmp.emailExp=Date.now()+15*60000;AUTH.tmp.enviado=false;AUTH.tmp.sinCorreo=false;
  try{await mcpCall('Gmail','send_message',{to:[AUTH.acc.email],subject:`Tu código de Mirai: ${code}`,body:`Hola${AUTH.acc.nombre?' '+AUTH.acc.nombre.split(' ')[0]:''},\n\nTu código de verificación de Mirai es: ${code}\n\nVence en 15 minutos. Si no lo pediste, ignora este mensaje.\n\nMirai · Tu futuro financiero`});AUTH.tmp.enviado=true}catch(e){AUTH.tmp.sinCorreo=true}authRender()}
async function checkEmailCode(code){return AUTH.tmp.emailCode&&Date.now()<AUTH.tmp.emailExp&&await sha256(String(code))===AUTH.tmp.emailCode}
function entrar(rem=true){sesSet(rem);AUTH.tmp={};if(!S.perfil.nombre&&AUTH.acc?.nombre){S.perfil.nombre=AUTH.acc.nombre;commit()}authHide()}

/* ---- eventos ---- */
document.addEventListener('input',e=>{const t=e.target;if(t.closest&&t.closest('.otp')&&t.dataset.oi!==undefined){t.value=t.value.replace(/\D/g,'').slice(-1);const boxes=[...t.closest('.otp').querySelectorAll('input')];if(t.value&&+t.dataset.oi<5)boxes[+t.dataset.oi+1].focus();const v=boxes.map(b=>b.value).join('');const h=t.closest('form').querySelector(`input[type=hidden][name="${t.closest('.otp').dataset.otp}"]`);h.value=v;if(v.length===6)t.closest('form').requestSubmit()}
  if(t.id==='a_pass'&&document.getElementById('pwMeter')){const sc=pwScore(t.value);const bars=document.querySelectorAll('#pwMeter .pw-bars i');const col=['#C8213B','#E08A00','#9EDB4E','#3F7A1E'];bars.forEach((b,i)=>b.style.background=i<sc&&t.value?col[Math.max(sc-1,0)]:'');document.getElementById('pwTxt').textContent=!t.value?'Escribe una contraseña':['Muy débil','Débil','Aceptable','Buena','Muy segura'][sc];document.getElementById('pwReq').innerHTML=pwReqs(t.value).map(([ok,tx])=>`<li class="${ok?'ok':''}">${ic(ok?'circle-check':'circle')}${tx}</li>`).join('')}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Backspace'&&t.dataset&&t.dataset.oi!==undefined&&!t.value&&+t.dataset.oi>0){t.closest('.otp').querySelectorAll('input')[+t.dataset.oi-1].focus()}});
document.addEventListener('paste',e=>{const t=e.target;if(!(t.closest&&t.closest('.otp')))return;const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();const boxes=[...t.closest('.otp').querySelectorAll('input')];boxes.forEach((b,i)=>b.value=d[i]||'');boxes[Math.min(d.length,5)].focus();boxes[0].dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('submit',async e=>{const f=e.target;const k=f.dataset.aform;if(!k)return;e.preventDefault();e.stopImmediatePropagation();const d={};new FormData(f).forEach((v,n)=>d[n]=v);f.querySelectorAll('input[type=checkbox][name]').forEach(x=>d[x.name]=x.checked);AUTH.err='';
  const fail=m=>{AUTH.err=m;AUTH.busy=false;authRender();return};
  if(k==='registro'){if(!String(d.nombre).trim())return fail('Escribe tu nombre.');if(!emailOk(d.email))return fail('Escribe un correo válido, por ejemplo nombre@correo.com.');if(pwScore(d.pass)<3)return fail('La contraseña es muy débil. Cumple los requisitos de la lista.');if(d.pass!==d.pass2)return fail('Las contraseñas no coinciden.');if(!d.terminos)return fail('Debes aceptar el tratamiento de datos para continuar.');
    AUTH.busy=true;AUTH.tmp={nombre:d.nombre,email:d.email};authRender();const salt=b64(rnd(16));AUTH.acc={v:1,nombre:String(d.nombre).trim(),email:String(d.email).trim().toLowerCase(),salt,iter:210000,hash:await pbkdf2(d.pass,salt),creado:new Date().toISOString(),emailVerificado:false,totp:{on:false,secret:''},backup:[],lock:{n:0,hasta:0},autolock:15,requerir:true};await saveAccount();AUTH.busy=false;sesSet(true);authShow('verificarEmail');sendEmailCode();return}
  if(k==='login'||k==='lock'){const a=AUTH.acc;if(!a)return fail('No hay una cuenta creada todavía.');if(a.lock?.hasta>Date.now())return fail(`Demasiados intentos. Intenta de nuevo en ${Math.ceil((a.lock.hasta-Date.now())/60000)} minuto(s) o recupera tu cuenta.`);
    if(k==='login'&&String(d.email).trim().toLowerCase()!==a.email)return fail('El correo o la contraseña no son correctos.');AUTH.busy=true;authRender();const h=await pbkdf2(d.pass,a.salt,a.iter||210000);AUTH.busy=false;
    if(h!==a.hash){a.lock=a.lock||{n:0,hasta:0};a.lock.n++;if(a.lock.n>=5){a.lock.hasta=Date.now()+5*60000;a.lock.n=0}await saveAccount();return fail(a.lock.hasta>Date.now()?'Demasiados intentos fallidos. Tu acceso quedó bloqueado 5 minutos.':`El correo o la contraseña no son correctos. Te quedan ${5-a.lock.n} intentos.`)}
    a.lock={n:0,hasta:0};a.ultimo=new Date().toISOString();await saveAccount();AUTH.tmp.rem=k==='lock'?true:!!d.rem;if(a.totp?.on){authShow('2fa');return}entrar(AUTH.tmp.rem);toast(`¡Hola${a.nombre?', '+a.nombre.split(' ')[0]:''}!`);return}
  if(k==='2fa'){const ok=AUTH.tmp.usarBackup?await useBackup(d.backup):await verifyTotp(AUTH.acc.totp.secret,d.otp);if(!ok)return fail(AUTH.tmp.usarBackup?'Ese código de respaldo no es válido o ya se usó.':'El código no es correcto. Revisa que la hora de tu celular esté bien configurada.');if(AUTH.tmp.usarBackup)toast(`Te quedan ${AUTH.acc.backup.filter(b=>!b.used).length} códigos de respaldo`);entrar(AUTH.tmp.rem!==false);return}
  if(k==='verificarEmail'){if(!await checkEmailCode(d.otp))return fail('El código no es correcto o ya venció.');AUTH.acc.emailVerificado=true;await saveAccount();toast('Correo verificado');afterEmail();return}
  if(k==='2fa-setup'){if(!await verifyTotp(AUTH.tmp.secret,d.otp))return fail('El código no coincide. Escribe el que aparece ahora en tu app.');AUTH.acc.totp={on:true,secret:AUTH.tmp.secret,desde:new Date().toISOString()};const codes=await genCodes();await saveAccount();authShow('backup',{codes});return}
  if(k==='recuperar-codigo'){const m=AUTH.tmp.metodo;const ok=m==='backup'?await useBackup(d.backup):m==='email'?await checkEmailCode(d.otp):await verifyTotp(AUTH.acc.totp.secret,d.otp);if(!ok)return fail('El código no es válido. Intenta de nuevo.');authShow('nueva-clave');return}
  if(k==='nueva-clave'){if(pwScore(d.pass)<3)return fail('La contraseña es muy débil. Cumple los requisitos.');if(d.pass!==d.pass2)return fail('Las contraseñas no coinciden.');const salt=b64(rnd(16));AUTH.acc.salt=salt;AUTH.acc.hash=await pbkdf2(d.pass,salt);AUTH.acc.lock={n:0,hasta:0};await saveAccount();toast('Contraseña actualizada');entrar(true);return}
},true);
function afterEmail(){if(!AUTH.acc.totp?.on){AUTH.tmp.secret=b32enc(rnd(20));authShow('2fa-setup')}else entrar(true)}

 aGo:b=>{if(b.dataset.v==='registro'&&AUTH.acc){authShow('login');return}authShow(b.dataset.v)},

 aSendEmail:()=>sendEmailCode(),aAfterEmail:()=>afterEmail(),
 aSkip2fa:()=>{if(AUTH.tmp.desdeAjustes){AUTH.tmp={};authHide();return}entrar(true);toast('Puedes activar la verificación en dos pasos en Ajustes › Seguridad')},
 aCopySecret:async()=>{try{await navigator.clipboard.writeText(AUTH.tmp.secret);toast('Clave copiada')}catch(e){toast(AUTH.tmp.secret)}},
 aCopyCodes:async()=>{try{await navigator.clipboard.writeText(AUTH.tmp.codes.join('\n'));toast('Códigos copiados')}catch(e){toast('Selecciona y copia los códigos')}},
 aDlCodes:()=>downloadFile('mirai-codigos-de-respaldo.txt',`Códigos de respaldo de Mirai\nCuenta: ${AUTH.acc.email}\nGenerados: ${fdate(today())}\n\n${AUTH.tmp.codes.join('\n')}\n\nCada código sirve una sola vez.`),
 aBackupDone:()=>{if(!document.getElementById('aSaved').checked){toast('Confirma que guardaste tus códigos');return}const fromAj=AUTH.tmp.desdeAjustes;if(fromAj){AUTH.tmp={};authHide();toast('Verificación en dos pasos activada')}else{entrar(true);toast('¡Tu cuenta está protegida!')}},
 aToggleBackup:()=>{AUTH.tmp.usarBackup=!AUTH.tmp.usarBackup;authRender()},
 aRecMethod:b=>{const m=b.dataset.m;if(m==='claude'){authShow('nueva-clave');return}AUTH.tmp.metodo=m;authShow('recuperar-codigo');if(m==='email')sendEmailCode()},
 aLogout:()=>logout(),
 aSkip:()=>{try{sessionStorage.setItem('nido-skip','1')}catch(e){}authHide();toast('Puedes crear tu cuenta cuando quieras en Ajustes › Seguridad')},
 secLogout:()=>logout(),secLock:()=>{if(AUTH.acc)authShow('lock')},
 sec2faOn:()=>{AUTH.tmp={secret:b32enc(rnd(20)),desdeAjustes:true};authShow('2fa-setup')},
 sec2faOff:async()=>{const c=(document.getElementById('sec2faCode')?.value||'').trim();if(!(await verifyTotp(AUTH.acc.totp.secret,c)||await useBackup(c))){toast('Escribe un código válido de tu app o de respaldo para desactivarla');return}AUTH.acc.totp={on:false,secret:''};AUTH.acc.backup=[];await saveAccount();toast('Verificación en dos pasos desactivada');render()},
 secCodes:async()=>{const codes=await genCodes();await saveAccount();AUTH.tmp={codes,desdeAjustes:true};authShow('backup')},
 secVerifyEmail:()=>{AUTH.tmp={desdeAjustes:true};authShow('verificarEmail');sendEmailCode()},
 secCrear:()=>authShow('registro'),
 secDelAcc:async()=>{if((document.getElementById('secDelTxt')?.value||'').trim().toUpperCase()!=='ELIMINAR'){toast('Escribe ELIMINAR para confirmar');return}try{if(AUTH.ref)await AUTH.ref.delete()}catch(e){}try{localStorage.removeItem('nido-cuenta');localStorage.removeItem('nido-tiene-cuenta')}catch(x){}sesClear();AUTH.acc=null;toast('Cuenta de acceso eliminada. Tus datos financieros siguen intactos.');render()}});
EXTRA_FORM.secPass=async(d)=>{if(await pbkdf2(d.actual,AUTH.acc.salt,AUTH.acc.iter||210000)!==AUTH.acc.hash){toast('La contraseña actual no es correcta');return false}if(pwScore(d.nueva)<3){toast('La contraseña nueva es muy débil');return false}if(d.nueva!==d.nueva2){toast('Las contraseñas no coinciden');return false}const salt=b64(rnd(16));AUTH.acc.salt=salt;AUTH.acc.hash=await pbkdf2(d.nueva,salt);await saveAccount();sesSet(true);toast('Contraseña actualizada');render();return false};
EXTRA_CHANGE.secAuto=async el=>{AUTH.acc.autolock=+el.value;await saveAccount();toast('Guardado')};
EXTRA_CHANGE.secReq=async el=>{AUTH.acc.requerir=el.checked;await saveAccount();toast(el.checked?'Se pedirá iniciar sesión':'Ya no se pedirá iniciar sesión al abrir')};

  return `<div class="grid g2"><div class="step"><div class="step-h">${isoIcon('perfil',28)}Tu cuenta</div><div class="list" style="margin:0"><div class="rowi">${av(a.nombre)}<div class="rb"><div class="rt">${esc(a.nombre)}</div><div class="rs">${esc(a.email)} ${a.emailVerificado?'<span class="pill ok">Verificado</span>':'<span class="pill warn">Sin verificar</span>'}</div></div></div></div>

  <div class="step"><div class="step-h">${isoIcon('ajustes',28)}Verificación en dos pasos ${a.totp?.on?'<span class="pill ok">Activa</span>':'<span class="pill warn">Inactiva</span>'}</div><p class="note" style="font-size:14px">Pide un código de tu celular además de la contraseña. Es la mejor protección si alguien conoce tu clave.</p>
    ${a.totp?.on?`<div class="note">Códigos de respaldo disponibles: <b>${(a.backup||[]).filter(b=>!b.used).length} de ${(a.backup||[]).length}</b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm soft" data-act="secCodes">${ic('refresh-cw')}Generar códigos nuevos</button></div><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${field('Para desactivarla, escribe un código',`<input class="inp" id="sec2faCode" placeholder="123456 o XXXX-XXXX" autocomplete="off">`)}<div class="f"><button class="btn danger" data-act="sec2faOff">Desactivar</button></div></div>`:`<div><button class="btn pri" data-act="sec2faOn">${ic('shield-check')}Activar verificación en dos pasos</button></div>`}</div></div>

    ${alertBox('info','info','Cómo se protege tu información','Tu contraseña nunca se guarda: guardamos una huella cifrada (PBKDF2, 210.000 iteraciones). El acceso a la página lo controla claude.ai, y solo la ven las personas con quienes compartas el libro.')}</div></div>

/* ---- bloqueo por inactividad ---- */
let lastAct=Date.now();['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{const a=AUTH.acc;if(!a||!a.autolock||AUTH.view||!document.body||document.body.classList.contains('locked'))return;if(a.requerir===false)return;if(Date.now()-lastAct>a.autolock*60000)authShow('lock')},15000);

async function authBoot(){document.body.classList.add('locked');AUTH.view='loading';authRender()
  await loadAccount();AUTH.ready=true;
  if(!AUTH.acc){let skip=false;try{skip=sessionStorage.getItem('nido-skip')==='1'}catch(e){}if(skip){AUTH.view='';authHide();return}authShow('bienvenida');return}
  if(AUTH.acc.requerir===false||sesGet()){AUTH.view='';authHide();return}
  authShow('login')}

function enhanceFields(root){(root||document).querySelectorAll('.f:not([data-enh])').forEach(f=>{f.dataset.enh=1;const lab=f.querySelector(':scope>label,:scope>.fl');if(!lab)return;
  const txt=[...lab.childNodes].filter(n=>n.nodeType===3||!n.classList?.contains('tip')).map(n=>n.textContent).join('').trim();if(!txt)return;

(function(){let el,cur;const mk=()=>{if(!el){el=document.createElement('div');el.id='ftip';el.setAttribute('role','tooltip');document.body.appendChild(el)}return el};
  const show=b=>{const t=mk();cur=b;t.textContent=b.dataset.tip;t.classList.add('on');const r=b.getBoundingClientRect(),w=Math.min(300,innerWidth-24);t.style.maxWidth=w+'px';const tw=t.offsetWidth,th=t.offsetHeight;let x=Math.max(12,Math.min(innerWidth-tw-12,r.left+r.width/2-tw/2));let y=r.top-th-10;let below=false;if(y<8){y=r.bottom+10;below=true}t.style.left=x+'px';t.style.top=y+'px';t.style.setProperty('--ax',(r.left+r.width/2-x)+'px');t.classList.toggle('below',below)};
  const hide=()=>{if(el)el.classList.remove('on');cur=null};
  document.addEventListener('mouseover',e=>{const b=e.target.closest?.('.finfo,.tip');if(b)show(b);else if(cur&&!e.target.closest?.('#ftip'))hide()});
  document.addEventListener('focusin',e=>{const b=e.target.closest?.('.finfo');if(b)show(b)});
  document.addEventListener('focusout',e=>{if(e.target.closest?.('.finfo'))hide()});
  document.addEventListener('click',e=>{const b=e.target.closest?.('.finfo');if(b){e.preventDefault();e.stopPropagation();cur===b&&el?.classList.contains('on')?hide():show(b)}else hide()},true);
  addEventListener('scroll',hide,true);addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
  new MutationObserver(()=>{if(!enhanceFields._q){enhanceFields._q=1;requestAnimationFrame(()=>{enhanceFields._q=0;enhanceFields()})}}).observe(document.body,{childList:true,subtree:true});

function normAddr(s){let t=' '+String(s||'')+' ';const R=[[/\b(avenida\s+carrera|av\.?\s*cra\.?|ak)\b\.?/gi,'Av. Cra'],[/\b(avenida\s+calle|av\.?\s*cl\.?|ac)\b\.?/gi,'Av. Cl'],[/\b(carrera|carerra|cra|kra|kr|cr|crr)\b\.?/gi,'Cra'],[/\b(calle|cll|clle|cl)\b\.?/gi,'Cl'],[/\b(avenida|avda|av)\b\.?(?!\s*(Cra|Cl)\b)/gi,'Av.'],[/\b(transversal|trans|tv|tr)\b\.?/gi,'Tv'],[/\b(diagonal|diag|dg)\b\.?/gi,'Dg'],[/\b(circular|cir)\b\.?/gi,'Cir'],[/\b(apartamento|apto|apt|ap)\b\.?/gi,'Apto'],[/\b(interior|int)\b\.?/gi,'Int'],[/\b(torre|tor)\b\.?/gi,'Torre'],[/\b(oficina|of)\b\.?/gi,'Of.'],
  [/\s*(n[uú]mero|nro\.?|no\.|n°|nº|#)\s*/gi,' # '],[/(\d+[a-z]?)\s*-\s*(\d+)/gi,'$1-$2'],[/\s+,/g,','],[/,\s*,/g,','],[/\s{2,}/g,' ']];

// Detecta ciudad, departamento, barrio/zona y deja la dirección limpia
function parseAddr(raw){const s=String(raw||'');if(s.trim().length<4)return null;const n=' '+FN(s).replace(/[,;]/g,' , ')+' ';
  const lastDigit=(()=>{const m=[...n.matchAll(/\d/g)];return m.length?m[m.length-1].index:-1})();
  let dep=null;for(const x of DEP_IDX){const re=new RegExp(`(^|[\\s,])${x.k.replace(/ /g,'\\s+')}(?=[\\s,]|$)`);const m=n.match(re);if(m&&m.index>lastDigit){dep={d:x.d,i:m.index,len:m[0].length};break}}
  let city=null;for(const x of GEO_IDX){const re=new RegExp(`(^|[\\s,])${x.k.replace(/ /g,'\\s+')}(?=[\\s,]|$)`,'g');let m;while((m=re.exec(n))){const after=m.index>lastDigit,comma=/,\s*$/.test(n.slice(0,m.index+1))||/^\s*,/.test(n.slice(m.index+m[0].length));if(!(after||comma))continue;if(dep&&dep.i===m.index&&x.k===FN(dep.d))continue;const sc=(after?2:0)+(comma?1:0)+(dep&&x.g.d===dep.d?3:0)+x.k.length/100;if(!city||sc>city.sc)city={g:x.g,sc,i:m.index,len:m[0].length}}}
  if(city&&dep&&city.g.d!==dep.d){const alt=GEO.find(g=>FN(g.c)===FN(city.g.c)&&g.d===dep.d);if(alt)city.g=alt}
  if(!city&&dep&&dep.d==='Bogotá D.C.')city={g:geoOf('Bogotá')};
  // zona / barrio
  let barrio='';const bm=s.match(/\b(?:barrio|br\.?|b\/|urbanizaci[oó]n|urb\.?|conjunto|sector)\s+([^,#\d][^,#]*)/i);if(bm)barrio=bm[1].trim().replace(/\s+(apto|torre|int|casa|piso).*$/i,'');
  let zona='';const cz=city?GEO_ZONAS[city.g.c]:null;if(!barrio&&cz){for(const z of cz.split('|').sort((a,b)=>b.length-a.length)){if(new RegExp(`(^|[\\s,])${FN(z).replace(/ /g,'\\s+')}(?=[\\s,]|$)`).test(n)){zona=z;break}}}
  if(!city&&!barrio&&!zona){for(const c in GEO_ZONAS){for(const z of GEO_ZONAS[c].split('|')){if(z.length>5&&new RegExp(`(^|[\\s,])${FN(z).replace(/ /g,'\\s+')}(?=[\\s,]|$)`).test(n)){city={g:geoOf(c)};zona=z;break}}if(city)break}}
  // dirección limpia: quita ciudad, departamento, país y barrio del texto
  let clean=s;const rm=t=>{if(!t)return;clean=clean.replace(new RegExp(`[,\\s-]*\\b${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b\\.?`,'i'),'')};
  const strip=w=>{const re=new RegExp(`[,\\s-]*(${[...w].map(ch=>'aáàAÁ'.includes(ch)?'[aáà]':'eéEÉ'.includes(ch)?'[eé]':'iíIÍ'.includes(ch)?'[ií]':'oóOÓ'.includes(ch)?'[oó]':'uúüUÚ'.includes(ch)?'[uúü]':ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('')})(\\s*d\\.?\\s*c\\.?)?(?=[\\s,.]|$)`,'i');clean=clean.replace(re,'')};
  if(bm)clean=clean.replace(bm[0],' ');const stripAll=()=>{if(city){strip(city.g.c);for(const a in GEO_ALIAS)if(GEO_ALIAS[a]===city.g.c&&a.length>3)strip(a)}if(dep)strip(dep.d.replace(' D.C.',''));strip('Colombia')};stripAll();if(zona)strip(zona);
  if(barrio){const keep=clean;clean=barrio;stripAll();barrio=clean.trim().replace(/[,\s-]+$/,'');clean=keep}
  return{ciudad:city?city.g.v:'',cityName:city?city.g.c:'',depto:city?city.g.d:dep?dep.d:'',barrio:barrio||zona,dir:normAddr(clean)}}

async function aiAddr(raw){let sample=null;if(S.cfg.ia.asist===false)return null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}if(!sample)return null;

Responde JSON {"direccion":"dirección normalizada al formato colombiano (Cl, Cra, Av., Tv, Dg, # 00-00, Apto) SIN ciudad ni barrio","barrio":"barrio o sector si se puede inferir, o vacío","ciudad":"municipio de Colombia o vacío si no se puede saber","departamento":"departamento o vacío","confianza":"alta|media|baja"}.
Si la dirección no menciona ciudad, NO la adivines: deja ciudad vacía.`;
  try{const r=await sample.json(prompt,{modelTier:'quick'});if(!r)return null;const g=r.ciudad?(GEO.find(x=>FN(x.c)===FN(r.ciudad)&&(!r.departamento||FN(x.d).startsWith(FN(r.departamento).slice(0,5))))||GEO.find(x=>FN(x.c)===FN(r.ciudad))):null;

function loanBars(cur,e,isC){const rows=[...e.hist.filter(h=>h.tipo==='cuota').map(h=>({n:h.n,f:h.prog,int:h.int,cap:h.cap,ex:h.extra||0,st:'ok'})),...e.plan.map((r,ix)=>({n:r.n,f:r.fecha,int:r.int,cap:r.cap,ex:r.extra||0,st:r.fecha<today()?'bad':ix===0||(e.vencidas.length&&ix===e.vencidas.length)?'next':'pend'}))];if(!rows.length)return '';
  const g=Math.ceil(rows.length/60);const B=[];for(let i=0;i<rows.length;i+=g){const ch=rows.slice(i,i+g);B.push({n:ch[0].n,n2:ch[ch.length-1].n,f:ch[0].f,int:ch.reduce((a,x)=>a+x.int,0),cap:ch.reduce((a,x)=>a+x.cap,0),ex:ch.reduce((a,x)=>a+x.ex,0),st:ch.some(x=>x.st==='bad')?'bad':ch.some(x=>x.st==='next')?'next':ch.every(x=>x.st==='ok')?'ok':'pend'})}

const linkKey=l=>l.t==='fondo'?'fondo':'meta:'+l.id;
const aporteOf=l=>S.fijos.find(f=>f.link&&linkKey(f.link)===linkKey(l));
const linkName=l=>l.t==='fondo'?'fondo de emergencia':`meta "${S.metas.find(m=>m.id===l.id)?.nombre||''}"`;
function payDays(){const sal=S.ingresos.find(i=>i.frec==='quincenal')||S.ingresos.find(i=>/salario|sueldo|n[oó]mina/i.test(i.concepto+' '+i.cat))||S.ingresos[0];return sal?{frec:sal.frec==='quincenal'?'quincenal':'mensual',dia:sal.frec==='quincenal'?15:(sal.dia||30),dia2:30,txt:sal.frec==='quincenal'?'cada quincena (15 y 30), cuando te pagan':`cada mes el día ${sal.dia||30}, cuando te pagan`}:{frec:'mensual',dia:30,dia2:30,txt:''}}
function aporteRow(l,sug,show=true){const f=aporteOf(l);if(f){const st=fijoStatus(f),p=st.venc[0]||st.prox;return `<div class="aporte on"><span class="ap-i">${ic('calendar-check')}</span><div><b>Aporte programado: ${$(f.valor)} ${f.frec==='quincenal'?'cada quincena':'cada mes'}</b><span>${p?`${st.venc.length?`<b class="neg">Pendiente desde ${fdate(p.due)}</b>`:`Próximo: ${fdate(p.due)}`}`:''}${f.pagos.length?` · llevas ${f.pagos.length} aporte${f.pagos.length>1?'s':''}`:''}</span></div>${p?`<button class="btn sm pri" data-modal="pagarFijo" data-id="${f.id}" data-per="${p.per}">${ic('check')}Ya aporté</button>`:''}<button class="btn icon sm ghost" data-modal="aporte" data-lt="${l.t}" data-lid="${l.id||''}" aria-label="Editar aporte">${ic('pencil')}</button></div>`}

M.aporte=ds=>{const l={t:ds.lt,id:ds.lid||undefined};const f=aporteOf(l);const pd=payDays();const fr=f?.frec||pd.frec;
  const base=+ds.sug||(l.t==='fondo'?gastosBasicos()*0.1:0);const sug=f?.valor||(base?Math.ceil((fr==='quincenal'?base/2:base)/1000)*1000:0);
  return{t:f?'Editar aporte programado':'Programar aporte fijo',d:`Define cuánto vas a guardar en tu ${linkName(l)} cada vez que recibas dinero. Queda como gasto fijo: te recordamos la fecha y, al marcarlo como hecho, se suma solo.`,
   b:`<form id="mform" data-form="aporte" data-lt="${l.t}" data-lid="${l.id||''}" class="form">${field('¿Cuánto vas a guardar cada vez?',money('valor',sug||'',{req:true}))}${field('¿Cada cuánto?',sel('frec',[{v:'quincenal',l:'Cada quincena'},{v:'mensual',l:'Cada mes'}],fr))}
   ${field('Día de la 1ª quincena',num('dia',f?.dia||(fr==='quincenal'?pd.dia:15)),{show:'frec:quincenal'})}${field('Día de la 2ª quincena',num('dia2',f?.dia2||30),{show:'frec:quincenal'})}${field('Día del mes',num('diaM',f&&f.frec==='mensual'?f.dia:(pd.frec==='mensual'?pd.dia:30)),{show:'frec:mensual'})}
   <div class="full note">${ic('lightbulb')} ${pd.txt?`Pusimos los días en que recibes tu ingreso (${pd.txt}). `:''}Lo ideal es apartarlo apenas te paguen, antes de gastar.${l.t==='meta'&&ds.sug?` Para llegar a tiempo a tu meta necesitas guardar unos ${$(+ds.sug)} al mes${fr==='quincenal'?` (${$(Math.ceil(+ds.sug/2/1000)*1000)} por quincena)`:''}.`:''}</div></form>`,
   f:`${f?`<button class="btn ghost" data-act="aporteDel" data-id="${f.id}" style="margin-right:auto">${ic('trash-2')}Quitar aporte</button>`:''}<button class="btn" data-act="mclose">Cancelar</button><button class="btn pri" form="mform">${ic('check')}${f?'Guardar cambios':'Programar aporte'}</button>`}};
EXTRA_FORM.aporte=(d,f)=>{if(!d.valor){toast('Escribe cuánto vas a guardar');return false}const l={t:f.dataset.lt,id:f.dataset.lid||undefined};const ex=aporteOf(l);const q=d.frec==='quincenal';
  const o={nombre:`Aporte a ${l.t==='fondo'?'fondo de emergencia':'meta: '+(S.metas.find(m=>m.id===l.id)?.nombre||'')}`,cat:'Ahorro',valor:d.valor,frec:d.frec,dia:q?Math.min(15,Math.max(1,Math.round(d.dia||15))):Math.min(31,Math.max(1,Math.round(d.diaM||30))),dia2:Math.min(31,Math.max(16,Math.round(d.dia2||30))),variable:false,medio:'Transferencia',proveedor:'Yo mismo',link:l};
  if(ex){const ch=ex.frec!==o.frec||ex.dia!==o.dia||ex.dia2!==o.dia2;Object.assign(ex,o);if(ch){ex.desde=mkey(today());ex.inicio=iso(today())}}else S.fijos.push({id:uid(),...o,desde:mkey(today()),inicio:iso(today()),pagos:[]});
  if(l.t==='fondo'&&S.fondo)S.fondo.on=true;const nf=aporteOf(l),p=fijoStatus(nf).prox;
  toast(`Guardarás ${$(d.valor)} ${q?'cada quincena':'cada mes'} en tu ${linkName(l)}. ${p?`Primer recordatorio: ${fdate(p.due)}.`:''} También lo verás en Gastos fijos.`,{type:'success',title:ex?'Aporte actualizado':'Aporte programado'})};
EXTRA_ACT.aporteDel=b=>{const snap=clone(S);S.fijos=S.fijos.filter(x=>x.id!==b.dataset.id);closeModal();commit();render();toast('El aporte programado se quitó. Lo que ya ahorraste se mantiene.',{type:'del',undo:snap})};
function aporteApply(fj,valor,fecha,gid){if(!fj.link)return '';const g=S.gastos.find(x=>x.id===gid);if(g)g.aporte={t:fj.link.t,id:fj.link.id,v:valor};
  if(fj.link.t==='fondo'){const F=S.fondo;F.on=true;F.saldo+=valor;F.mov.push({id:uid(),tipo:'guardar',valor,fecha,nota:'Aporte programado',gid});return `¡Bien! Guardaste ${$(valor)}. Tu fondo de emergencia tiene ${$(F.saldo)}.`}
  const m=S.metas.find(x=>x.id===fj.link.id);if(!m)return '';m.ahorrado+=valor;return `¡Bien! Sumaste ${$(valor)} a "${m.nombre}". Llevas ${$(m.ahorrado)} de ${$(m.objetivo)} (${pct(m.objetivo?m.ahorrado/m.objetivo:0,0)}).`}
function aporteRevert(g){const a=g.aporte;if(a.t==='fondo'){S.fondo.saldo=Math.max(0,S.fondo.saldo-a.v);S.fondo.mov=S.fondo.mov.filter(m=>m.gid!==g.id)}else{const m=S.metas.find(x=>x.id===a.id);if(m)m.ahorrado=Math.max(0,m.ahorrado-a.v)}const fj=S.fijos.find(f=>f.id===g.fijoId);if(fj)fj.pagos=fj.pagos.filter(p=>p.per!==g.per)}

const FAQ=[
 {c:'DIAN',q:'¿Cómo le doy acceso a mi contador?',a:'Ve a <b>DIAN › Acceso de tu contador</b>, escribe su nombre, elige qué puede ver y hasta cuándo, y envíale el enlace. Solo puede ver, descargar y dejarte notas. Requiere tener Mirai en tu servidor (Vercel + Supabase).',go:'contador'},
 {c:'DIAN',q:'¿Mis hijos me ayudan a pagar menos renta?',a:'Sí, si son tus dependientes: menores de 18 años, de 18 a 23 si estudian, o con discapacidad. Márcalos en <b>DIAN › Declaración de renta › Dependientes</b>.',go:'renta'},
 {c:'DIAN',q:'¿Para qué registro mis bienes?',a:'Tu casa, carro y cuentas forman tu patrimonio, que se declara cada año y define si estás obligado a declarar. También sirven para estimar el predial y el impuesto vehicular.',go:'renta'},
 {c:'Logros',q:'¿Cómo gano puntos y subo de nivel?',a:'Solo con usar Mirai: registrar gastos (5 puntos), ingresos (20), pagar cuotas a tiempo (25), marcar gastos fijos pagados (10), cumplir metas, retos y misiones semanales, y ganar insignias. Míralo en <b>Planeación › Logros y nivel</b>.',go:'logros'},
 {c:'Logros',q:'¿Puedo quitar los logros?',a:'Sí. En <b>Logros y nivel</b> apaga el interruptor "Mostrar logros" y desaparecen de Inicio y del menú.',go:'logros'},
 {c:'Notificaciones',q:'¿Qué servicio de correo uso: Gmail, SendGrid, Resend o SMTP?',a:'<b>Gmail</b> si quieres algo rápido con tu cuenta (necesitas una contraseña de aplicación). <b>Resend</b> es el más fácil con Vercel. <b>SendGrid</b> si ya lo usas. <b>SMTP</b> si tienes el correo de tu hosting (Hostinger, Zoho…). Elígelo en Ajustes › Alertas y notificaciones.',go:'ajustes'},
 {c:'Notificaciones',q:'¿Dónde quedan guardadas mis claves?',a:'En tu servidor (por ejemplo Vercel + Supabase), cifradas con AES-256. El navegador solo ve los últimos 4 caracteres.',go:'ajustes'},
 {c:'Primeros pasos',q:'¿Por dónde empiezo?',a:'Abre <b>Puesta en marcha</b> en el menú. Te lleva paso a paso: tu ingreso, tus gastos fijos, tus cuentas y tus deudas. Con eso Mirai ya puede avisarte y aconsejarte.',go:'puesta'},
 {c:'Primeros pasos',q:'Ya tenía deudas y préstamos pagados en parte, ¿debo registrar cada pago?',a:'No. Al registrar el préstamo, en "¿Ya has pagado algo?" elige <b>Va al día</b>, <b>Ya se pagaron algunas cuotas</b> o <b>Sé cuánto se debe hoy</b>. Pon la fecha real en que empezó el préstamo.',go:'le-debo'},
 {c:'Primeros pasos',q:'¿Puedo usar Mirai en el celular?',a:'Sí. La plataforma se adapta a la pantalla del celular. El menú se abre con el botón de tres rayas arriba a la izquierda.'},
 {c:'Primeros pasos',q:'¿Escribo mi salario completo o lo que me llega?',a:'Puedes escribir cualquiera. Si escribes el salario o el valor del contrato, elige <b>"No, es el salario o valor del contrato"</b> y Mirai calcula salud, pensión, fondo de solidaridad, retención y tus otros descuentos (libranzas, cooperativa…). Si eres independiente, calcula la seguridad social sobre el 40%. Todo es configurable porque no a todos les descuentan lo mismo.',go:'ingresos'},
 {c:'Inteligencia artificial',q:'¿Puedo apagar la IA o usar ChatGPT o Gemini?',a:'Sí. En <b>Ajustes › Inteligencia artificial</b> puedes apagarla, apagar funciones una por una o elegir proveedor. Para OpenAI, Gemini o tu propia cuenta de Claude se usa una clave de API (las suscripciones personales no se pueden vincular). Dentro de claude.ai la conexión a otros proveedores puede estar bloqueada; en ese caso Mirai usa Claude incluido.',go:'ajustes',tab:'ia'},
 {c:'Cuenta y seguridad',q:'¿Me pueden llegar los avisos por correo o WhatsApp?',a:'Sí. En <b>Ajustes › Alertas y notificaciones</b> activa el correo (resumen diario o semanal desde tu Gmail conectado) y WhatsApp (te dejamos el mensaje listo para enviarlo a tu número con un toque). Elige qué avisos van por cada canal.',go:'ajustes',tab:'alertas'},
 {c:'Inteligencia artificial',q:'¿Cómo uso el asesor financiero?',a:'Toca la <b>burbuja</b> flotante (puedes arrastrarla a donde quieras) y escribe tu pregunta. Si vas a decidir una compra, crédito, tarjeta o préstamo, te lleva al <b>Consejo antes de gastar</b> para analizarlo con tus números. Elige el tono <b>Sencillo</b> o <b>Financiero</b>. Tus conversaciones quedan en el historial.',go:'consejero'},
 {c:'Gastos',q:'¿Cuál es la diferencia entre gasto, gasto fijo y deuda?',a:'<b>Gasto</b>: algo que pagaste una vez (mercado, un almuerzo). <b>Gasto fijo</b>: se repite y no se acaba (arriendo, servicios, colegio). <b>Deuda</b>: tiene un total que se termina de pagar en cuotas (crédito, compra a cuotas como un televisor con Celya).'},
 {c:'Gastos',q:'¿Qué es un gasto hormiga?',a:'Gastos pequeños y frecuentes (cafés, snacks, domicilios) que al mes suman mucho. La IA los detecta sola; puedes ponerles un límite mensual en Ajustes.',go:'gastos'},
 {c:'Gastos',q:'Los servicios no cuestan lo mismo cada mes, ¿cómo los registro?',a:'En Gastos fijos elige <b>"Cambia cada mes (rango)"</b> y escribe cuánto pagas en un mes bajo y en uno alto. Se usa el promedio y el rango se ajusta con tus pagos reales.',go:'fijos'},
 {c:'Gastos',q:'Mi recibo del agua aparece vencido pero este mes no tocaba pagar',a:'Abre el gasto fijo, toca <b>Pagar › "No tocaba pagar · cambiar fecha"</b> y pon la fecha del próximo pago. Desde esa fecha se cuentan los periodos.',go:'fijos'},
 {c:'Gastos',q:'¿Cómo registro un imprevisto?',a:'Registra el gasto normalmente; si escribes algo como "se dañó la nevera" la categoría <b>Imprevistos</b> se pone sola y te ofrece pagarlo con tu fondo de emergencia. También puedes hacerlo desde Metas › Fondo de emergencia › "Usar para un imprevisto".',go:'metas'},
 {c:'Gastos',q:'No encuentro mi categoría',a:'Al final de la lista de categorías toca <b>"Crear categoría"</b> o <b>"Que la IA la cree"</b>. Queda guardada y seleccionada.'},
 {c:'Préstamos y deudas',q:'No entiendo la tabla de cuotas',a:'Cada fila es un pago. <b>Valor de la cuota = Abono a la deuda + Interés</b> (+ seguros si hay). El abono es lo que baja la deuda; el interés es el costo del préstamo (o tu ganancia si prestaste). "Queda debiendo" es lo que falta después de esa cuota.',go:'me-deben'},
 {c:'Préstamos y deudas',q:'¿Qué significa "1% mensual" y "E.A."?',a:'El <b>interés mensual</b> es lo que se cobra cada mes sobre lo que se debe. La <b>tasa E.A. (efectiva anual)</b> es lo que cuesta en un año completo; es la que muestran los bancos. Si solo tienes la E.A., escríbela y Mirai calcula la mensual.'},
 {c:'Préstamos y deudas',q:'¿Qué sistema de cuota elijo?',a:'Si no sabes, deja <b>Cuota fija</b>: es el que usan los bancos en Colombia. "Cuota que va bajando" paga menos intereses en total. "Interés sobre lo prestado" es común entre conocidos. "Solo intereses" es típico en empeños.'},
 {c:'Préstamos y deudas',q:'¿Cómo registro algo que empeñé?',a:'En <b>Le debo › Registrar empeño</b>. Pon la casa de empeño, el valor que te prestaron, el interés, qué empeñaste y la fecha límite para recuperarlo. Te avisamos 15 días antes.',go:'le-debo'},
 {c:'Préstamos y deudas',q:'Me pagaron un valor diferente a la cuota, ¿qué hago?',a:'En Registrar pago elige <b>"Hizo un abono"</b> y escribe el valor. Puedes decidir si el abono acorta el plazo o baja la cuota.'},
 {c:'Préstamos y deudas',q:'¿Puedo registrar préstamos que se cobran todos los días?',a:'Sí. En "¿Cada cuánto se paga?" elige <b>Diario</b> o <b>Diario (lunes a sábado)</b>.'},
 {c:'Préstamos y deudas',q:'El banco no está en la lista',a:'En la lista de bancos toca <b>"Crear banco o entidad"</b> o <b>"Que la IA la identifique"</b> escribiendo el nombre o el NIT. Confirma el NIT con tu extracto.'},
 {c:'Ahorro',q:'¿Qué es el fondo de emergencia y cuánto debo tener?',a:'Es dinero guardado aparte solo para imprevistos (perder el trabajo, una enfermedad, un daño). Lo recomendado es entre 3 y 6 meses de tus gastos básicos. Puedes cambiar los meses en Ajustes.',go:'metas'},
 {c:'Ahorro',q:'¿Cómo hago para no olvidar ahorrar cada quincena?',a:'En Metas y emergencia toca <b>"Programar un aporte fijo"</b> en el fondo de emergencia o en cualquier meta. Elige cuánto y cada cuánto: queda en tus gastos fijos, te recordamos el día en que te pagan y al tocar <b>"Ya aporté"</b> se suma solo.',go:'metas'},
 {c:'Ahorro',q:'¿Cómo registro mis suscripciones de streaming?',a:'En <b>Mi dinero › Suscripciones › Agregar</b>. Toca el servicio, escribe el valor y la fecha del próximo cobro. Si compartes el plan, indica entre cuántos y solo se cuenta tu parte.',go:'suscripciones'},
 {c:'Inteligencia artificial',q:'¿Qué hace la IA en Mirai?',a:'Categoriza gastos, detecta gastos hormiga, lee facturas, extractos y comprobantes con foto, identifica bancos por NIT, crea categorías, detecta la ciudad de una dirección y te aconseja antes de gastar o prestar.'},
 {c:'Inteligencia artificial',q:'¿Puedo confiar en lo que llena la IA?',a:'La IA ayuda, pero puede equivocarse. Siempre revisa los datos antes de guardar, sobre todo valores, fechas y NIT.'},
 {c:'Inteligencia artificial',q:'La lectura con foto no funciona',a:'Funciona dentro de claude.ai. Usa una foto nítida, con buena luz y el documento completo. Si no lee bien, escribe los datos a mano.'},
 {c:'Cuenta y seguridad',q:'¿Cómo protejo mi información?',a:'Crea tu cuenta con contraseña y activa la <b>verificación en dos pasos</b> en Ajustes › Seguridad. Guarda tus códigos de respaldo en un lugar seguro.',go:'ajustes',tab:'seguridad'},
 {c:'Cuenta y seguridad',q:'Perdí el celular con la app de autenticación',a:'En la pantalla de verificación toca <b>"¿No tienes tu celular? Usa un código de respaldo"</b>. Si tampoco los tienes, toca <b>"¿Olvidaste tu contraseña?"</b> para recuperar la cuenta con un código que te enviamos al correo.'},
 {c:'Cuenta y seguridad',q:'¿Dónde se guardan mis datos?',a:'Si en la parte de abajo del menú dice <b>"Guardado en la nube"</b>, tus datos se guardan en la nube de tu cuenta. Si dice <b>"Solo en este navegador"</b>, quedan en este equipo: haz respaldos en Ajustes › Respaldo.'},
 {c:'Cuenta y seguridad',q:'¿Cómo borro todo o elimino mi cuenta?',a:'En Ajustes › Respaldo puedes descargar un respaldo, formatear los datos o eliminar la cuenta. Ambas acciones son definitivas.',go:'ajustes'},
 {c:'Otros',q:'¿Puedo llevar las finanzas de mi negocio aparte?',a:'Sí. Toca el nombre del libro arriba en el menú y crea un libro nuevo. Cada libro tiene sus propios datos.'},
 {c:'Otros',q:'¿Cómo comparto gastos con otras personas?',a:'En Planeación › Gastos compartidos crea un grupo (un viaje, la casa) y anota quién pagó; Mirai calcula quién le debe a quién.',go:'compartidos'},
 {c:'Otros',q:'¿Cómo vuelvo a ver el tour?',a:'Usa el botón <b>"Ver el tour"</b> en Manual e instructivos, o el botón "Hacer el tour" en Ajustes.',go:'manual'}];
