<style>
/* Layout: estilo red social (Meta) — barra superior fija, menú lateral con iconos en círculo y submenús, tarjetas blancas sobre gris, azul como único acento */
:root{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#141B2D; --muted:#5E6577; --line:#D3D7DE; --line-2:#E6E8EC; --hover:#EFF1F3; --field:#F1F2F4;

  --blue:#3F7A1E; --blue-2:#2F6116; --blue-soft:#EDF7E1; --blue-ink:#2F6116;
  --green:#3F7A1E; --green-soft:#EDF7E1; --red:#C8213B; --red-soft:#FCE8EB; --amber:#8A5A00; --amber-soft:#FEF3D6; --violet:#1F2B4B; --violet-soft:#E7EAF2;
  --shadow:0 1px 2px rgba(20,27,45,.12); --shadow-lg:0 12px 28px rgba(20,27,45,.2),0 2px 4px rgba(20,27,45,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --top:56px; color-scheme:light;
}
html.dk{
  --bg:#10151F; --card:#1A2131; --ink:#E6E9EF; --muted:#A3AABB; --line:#323B50; --line-2:#2A3245; --hover:#252D40; --field:#252D40;
  --navy:#C9D3EA; --pri-bg:#9EDB4E; --pri-fg:#1F2B4B;
  --blue:#9EDB4E; --blue-2:#B5E57A; --blue-soft:#24331C; --blue-ink:#B5E57A;
  --green:#9EDB4E; --green-soft:#24331C; --red:#F2647A; --red-soft:#3D2028; --amber:#F7B928; --amber-soft:#3A3020; --violet:#AFC0E8; --violet-soft:#273149;
  --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 12px 28px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.34;-webkit-font-smoothing:antialiased}

a{color:var(--blue-ink);text-decoration:none} a:hover{text-decoration:underline}
svg.i{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
html.priv :is(.num,.kv,.rv,.bv,.big,.metric b,.ttotal span:last-child,.ui-money input){filter:blur(7px);transition:filter .15s}
html.priv :is(.num,.kv,.rv,.bv,.big,.metric b):hover{filter:none}
.pos{color:var(--green)} .neg{color:var(--red)} .wrn{color:var(--amber)} .mut{color:var(--muted)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);background:var(--card);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-right{justify-content:flex-end}
.logo{width:40px;height:40px;border-radius:50%;background:#1F2B4B;color:#9EDB4E;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.04em;flex:none;border:0;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;height:40px;padding:0 14px;min-width:0;width:260px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);width:100%;min-width:0}

.tabs-c a span.in{display:grid;place-items:center;width:100%;height:46px;border-radius:8px;margin-top:3px}
.tabs-c a:hover span.in{background:var(--hover)}

.tabs-c a.on:hover span.in{background:transparent}
.tabs-c svg.i{width:26px;height:26px}
.rbtn{width:40px;height:40px;border-radius:50%;background:var(--line-2);color:var(--ink);display:grid;place-items:center;border:0;cursor:pointer;position:relative;flex:none;padding:0}
.rbtn:hover{filter:brightness(.95)} html.dk .rbtn:hover{filter:brightness(1.2)}
.rbtn.on{background:var(--blue-soft);color:var(--blue)}
.rbtn .dot{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#E41E3F;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1F2B4B,#3F7A1E);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;border:0;cursor:pointer}
.avatar.sm{width:36px;height:36px;font-size:13px} .avatar.lg{width:84px;height:84px;font-size:30px;border:4px solid var(--card)}
.avatar.c1{background:linear-gradient(135deg,#3F7A1E,#9EDB4E)} .avatar.c2{background:linear-gradient(135deg,#C2571A,#F7B928)} .avatar.c3{background:linear-gradient(135deg,#1F2B4B,#5A6C9E)} .avatar.c4{background:linear-gradient(135deg,#2C3E6B,#3F7A1E)}
.ham{display:none}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:var(--sbw,268px) minmax(0,1fr);align-items:start;transition:grid-template-columns .2s ease}
body.sb-col{--sbw:68px}
aside.side{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line-2);padding-left:env(safe-area-inset-left,0px);min-width:0;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px}
.sb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;padding:6px;border-radius:8px;text-align:left}
.sb-brand:hover{background:var(--hover)}
.sb-logo{width:32px;height:32px;border-radius:8px;background:#1F2B4B;color:#9EDB4E;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-brand .sb-l b,.sb-user .sb-l b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sb-brand .sb-l small,.sb-user .sb-l small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.sb-toggle{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.sb-toggle:hover{background:var(--hover);color:var(--ink)}
.sb-toggle svg.i{width:18px;height:18px}
.sb-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.sb-body>*,.sb-sub>*{flex-shrink:0}
.sb-label{font-size:12px;font-weight:600;color:var(--muted);padding:14px 8px 6px;white-space:nowrap}
.sb-label:first-child{padding-top:4px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 8px;border-radius:8px;color:var(--ink);font:inherit;font-size:14px;font-weight:500;background:transparent;border:0;cursor:pointer;text-align:left;text-decoration:none;white-space:nowrap}
.sb-item:hover{background:var(--hover);text-decoration:none}
.sb-item.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.sb-ic{width:22px;height:22px;display:grid;place-items:center;flex:none;color:var(--muted)}
.sb-ic svg.i{width:18px;height:18px}
.sb-item.on .sb-ic{color:var(--blue)}
.sb-chev{color:var(--muted);display:grid;transition:transform .2s;flex:none}
.sb-chev svg.i{width:16px;height:16px}
.sb-item.open .sb-chev{transform:rotate(90deg)}
.sb-bdg{background:#E41E3F;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;flex:none}
.sb-bdg.info{background:var(--lime);color:#1F2B4B}
.sb-sub{display:none;flex-direction:column;gap:1px;margin:2px 0 4px 18px;padding-left:10px;border-left:1px solid var(--line)}
.sb-sub.open{display:flex}
.sb-sub a{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;color:var(--muted);font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.sb-sub a:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.sb-sub a.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.sb-sub a .sb-bdg{margin-left:auto}
.sb-foot{border-top:1px solid var(--line-2);padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px}
.sb-sync{display:flex;flex-direction:column;gap:2px;padding:4px 8px;font-size:12.5px}
.sb-user{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:8px;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.sb-user:hover{background:var(--hover)}
.sb-chev2{color:var(--muted);display:grid}.sb-chev2 svg.i{width:16px;height:16px}
body.sb-col .sb-l,body.sb-col .sb-chev,body.sb-col .sb-chev2,body.sb-col .sb-label,body.sb-col .sb-sub,body.sb-col .sb-item .sb-bdg{display:none}
body.sb-col .sb-head{flex-direction:column;padding:12px 8px 6px}
body.sb-col .sb-body{padding:4px 8px}
body.sb-col .sb-item{justify-content:center;padding:0;height:40px;position:relative}
body.sb-col .sb-item .sb-ic svg.i{width:20px;height:20px}
body.sb-col .sb-body>.sb-item:not(:first-child){margin-top:2px}
body.sb-col .sb-foot{padding:8px}
body.sb-col .sb-sync{align-items:center;padding:4px 0}
body.sb-col .sb-sync .syncp{font-size:0;gap:0}
body.sb-col .sb-user{justify-content:center;padding:4px}
body.sb-col .sb-brand{justify-content:center;padding:4px}
.flyout{padding:6px;min-width:220px}
.flyout .fh{font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px 4px}
.umenu{width:280px;padding:6px}
.umenu .uh{display:flex;gap:10px;align-items:center;padding:10px}
.umenu .uh b{display:block}
.umenu hr{border:0;border-top:1px solid var(--line-2);margin:6px 0}
.umenu .opt.danger{color:var(--red)} .umenu .opt.danger .oi{background:var(--red-soft);color:var(--red)}
.kbd{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.syncp{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.syncp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncp.cloud::before{background:var(--green)} .syncp.local::before{background:#F7B928} .syncp.err::before{background:var(--red)}
main{min-width:0;padding-block:20px 64px;padding-left:max(16px,2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2vw);display:flex;flex-direction:column;gap:16px;max-width:1180px;width:100%}

/* ---------- tipografía y bloques ---------- */
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-h .pic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.page-h .pic svg.i{width:26px;height:26px}
.page-h h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:14.5px;max-width:72ch}
.page-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:17px;font-weight:700}
.card h3{margin:0;font-size:15px;font-weight:700}
.card .sub-t{color:var(--muted);font-size:13px}
.lbl-s{font-size:12.5px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.kpi{flex-direction:row;align-items:center;gap:12px}
.kpi .ki{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .kv{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .ks{font-size:12.5px;color:var(--muted)}
.kpi>div{min-width:0}
.t-blue{background:var(--blue-soft);color:var(--blue)} .t-green{background:var(--green-soft);color:var(--green)} .t-red{background:var(--red-soft);color:var(--red)} .t-amber{background:var(--amber-soft);color:var(--amber)} .t-violet{background:var(--violet-soft);color:var(--violet)} .t-gray{background:var(--line-2);color:var(--muted)}
.b-blue{background:#1F2B4B} .b-green{background:#3F7A1E} .b-red{background:#C8213B} .b-amber{background:#D98300} .b-violet{background:#3B4C7C} .b-teal{background:#5E9A2C} .b-pink{background:#2C3E6B} .b-gray{background:#5E6577} .b-grad{background:linear-gradient(135deg,#1F2B4B,#3F7A1E 70%,#9EDB4E)}
.note{font-size:13px;color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.info{background:var(--blue-soft);color:var(--blue-ink)} .pill.gray{background:var(--line-2);color:var(--muted)} .pill.vio{background:var(--violet-soft);color:var(--violet)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:14px;padding:28px 16px}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--muted)}
.empty .ei svg.i{width:28px;height:28px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px;height:36px;padding:0 14px;border-radius:6px;border:0;cursor:pointer;background:var(--line-2);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.96);text-decoration:none} html.dk .btn:hover{filter:brightness(1.15)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg)}
.btn.soft{background:var(--blue-soft);color:var(--blue-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;font-size:13.5px;padding:0 10px}
.btn.lg{height:44px;font-size:16px;padding:0 20px}
.btn.icon{width:36px;padding:0} .btn.icon.sm{width:30px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ai{background:linear-gradient(135deg,#1F2B4B,#3F7A1E);color:#fff}

/* ---------- campos estilo shadcn ---------- */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.fl{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.f .hint{font-size:12.5px;color:var(--muted);font-weight:400}
.inp,.ui-trigger,.ui-money{height:40px;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:0 12px;display:flex;align-items:center;gap:8px;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.inp:focus,.ui-trigger:focus-visible,.ui-trigger.open,.ui-money:focus-within{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.inp::placeholder,.ui-money input::placeholder{color:var(--muted);opacity:.8}
.ui-trigger{cursor:pointer;text-align:left;justify-content:space-between}
.ui-trigger .tv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ui-trigger .tv.ph{color:var(--muted)}
.ui-trigger>svg.i{color:var(--muted);width:18px;height:18px}
.ui-money{padding:0 0 0 12px;gap:4px}
.ui-money .cur{color:var(--muted);font-weight:600;font-size:14px;flex:none}
.ui-money input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);height:100%;width:100%;min-width:0;padding-right:12px;font-variant-numeric:tabular-nums;font-weight:600}
.f.err .inp,.f.err .ui-trigger,.f.err .ui-money{border-color:var(--red)}
.chk{appearance:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;background:var(--card);display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.chk:checked{background:var(--forest);border-color:var(--forest)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.switch{appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.switch:checked{background:var(--blue)} .switch:checked::after{left:19px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;align-items:end}
.form .full{grid-column:1/-1}
.form .s2{grid-column:span 2}
.seg{display:inline-flex;background:var(--field);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:6px 12px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.choice{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--card);text-align:left;font:inherit;color:var(--ink)}
.choice:hover{border-color:var(--muted)}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice .ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.choice b{display:block;font-size:14.5px;margin-bottom:2px}
.choice span{font-size:13px;color:var(--muted);line-height:1.35}
.choice .rec{position:absolute;top:-9px;right:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-fg)}
.tip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line-2);color:var(--muted);font-size:11px;font-weight:700;cursor:help;position:relative}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:260px;background:#1C1E21;color:#fff;font-size:12.5px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:60;white-space:normal;box-shadow:var(--shadow-lg)}

/* ---------- popovers (select / calendario / menús) ---------- */

/* =====================================================================
   TEMA ESTILO SUITE OFIMÁTICA (Fluent 2): barra de suite, panel de
   navegación claro con indicador, tarjetas con sombra suave, controles 32px
   ===================================================================== */
:root{--bg:#F5F5F5;--card:#FFFFFF;--ink:#242424;--muted:#616161;--line:#D1D1D1;--line-2:#E0E0E0;--hover:#F0F0F0;--field:#FFFFFF;--nav:#FAFAFA;--navsel:#EBEBEB;--top:48px;
  --shadow:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);--shadow-lg:0 0 2px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.14);
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;--r:8px}
html.dk{--bg:#1F1F1F;--card:#292929;--ink:#FFFFFF;--muted:#ADADAD;--line:#4D4D4D;--line-2:#3D3D3D;--hover:#333333;--field:#1F1F1F;--nav:#242424;--navsel:#3D3D3D;
  --shadow:0 0 2px rgba(0,0,0,.24),0 2px 4px rgba(0,0,0,.28);--shadow-lg:0 0 2px rgba(0,0,0,.24),0 14px 28px rgba(0,0,0,.4)}
body{font-size:14px;line-height:20px}
body::before{background:#1F2B4B}
/* barra de suite */
.topbar{background:#1F2B4B!important;border-bottom:0!important;backdrop-filter:none;color:#fff;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:8px}
.topbar .ib{background:transparent;border:0;color:#fff;border-radius:4px;width:40px;height:40px}
.topbar .ib:hover{background:rgba(255,255,255,.12)}
.topbar .ib .dot{border-color:#1F2B4B}
.waffle svg.i{width:20px;height:20px}
.wordmark{display:flex;align-items:center;gap:8px;color:#fff!important;text-decoration:none!important;font-weight:600;font-size:16px;padding:0 6px;height:40px;border-radius:4px;flex:none}
.wordmark:hover{background:rgba(255,255,255,.12)}
.topbar .tb-sep{background:rgba(255,255,255,.3)}
.topbar .crumbs,.topbar .crumbs a{color:rgba(255,255,255,.8)} .topbar .crumbs .cur{color:#fff}
.topbar .search{background:#fff;border:0;border-radius:4px;height:32px;width:min(468px,36vw);color:#616161}
html.dk .topbar .search{background:#2E2E2E;color:#ADADAD}
.topbar .search input{color:#242424} html.dk .topbar .search input{color:#fff}
.topbar .search:focus-within{box-shadow:inset 0 -2px 0 #9EDB4E}
.topbar .search .kbd{border-color:#E0E0E0;color:#707070}
.topbar .avatar{width:32px;height:32px;font-size:12px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.mob-only{display:none!important}
/* panel de navegación */
aside.side{background:var(--nav);border-right:1px solid var(--line-2)}
.sb-head{padding:8px 8px 4px;gap:4px}
.sb-ham{width:36px;height:36px;border:0;background:transparent;border-radius:4px;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.sb-ham:hover{background:var(--hover)} .sb-ham svg.i{width:20px;height:20px}
.sb-brand{padding:4px 6px;border-radius:4px}
.sb-body{padding:4px 8px 12px;gap:1px}
.sb-label{font-size:12px;font-weight:600;color:var(--muted);padding:16px 10px 6px}
.sb-item{height:36px;border-radius:4px;font-size:14px;font-weight:400;padding:0 10px;position:relative}
.sb-item:hover{background:var(--hover)}
.sb-item.on{background:var(--navsel);color:var(--ink);font-weight:600}
.sb-item.on::before,.sb-sub a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:2px;background:#3F7A1E}
html.dk .sb-item.on::before,html.dk .sb-sub a.on::before{background:#9EDB4E}
.sb-sub{border-left:0;margin:0 0 4px 14px;padding-left:0}
.sb-sub a{height:32px;border-radius:4px;color:var(--ink);font-weight:400;padding:0 10px 0 22px;position:relative}
.sb-sub a:hover{background:var(--hover)}
.sb-sub a.on{background:var(--navsel);color:var(--ink);font-weight:600}
.sb-foot{border-top:1px solid var(--line-2)}
.sb-user{border-radius:4px}
body.sb-col .sb-head{padding:8px 6px}
body.sb-col .sb-item.on::before{left:2px}
/* contenido */
main{padding-block:24px 64px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw);gap:16px;max-width:1320px}
.page-h{gap:14px}
.page-h h1{font-size:28px;line-height:36px;font-weight:600;letter-spacing:0}
.page-h p{font-size:14px;line-height:20px;color:var(--muted)}
.pic.isop,.pic.isop svg{width:44px;height:44px}
.card{border-radius:8px;box-shadow:var(--shadow);padding:20px;border:0}
.card h2{font-size:16px;line-height:22px;font-weight:600}
.card h3{font-size:14px;font-weight:600}
.kpi .kv{font-size:22px;line-height:30px;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.kpi .kl{font-size:12px;font-weight:400}
.kpi .ki{border-radius:8px;width:40px;height:40px}
/* botones */
.btn{height:32px;border-radius:4px;font-size:14px;font-weight:600;padding:0 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);filter:none!important}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--navsel)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg);border-color:transparent}
.btn.pri:hover{background:#2C3D69} html.dk .btn.pri:hover{background:#B5E57A}
.btn.soft{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink)} .btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--red)}
.btn.ai{border:0}
.btn.lg{height:40px;font-size:15px}
.btn.sm{height:28px;font-size:13px;padding:0 8px}
.help-btn{border:1px solid var(--line)!important}
/* campos */
.inp,.ui-trigger,.ui-money{height:32px;border-radius:4px;border:1px solid var(--line);border-bottom-color:#616161;background:var(--field);font-size:14px}
html.dk .inp,html.dk .ui-trigger,html.dk .ui-money{border-bottom-color:#ADADAD}
textarea.inp{height:auto}
.inp:focus,.ui-trigger:focus-visible,.ui-trigger.open,.ui-money:focus-within{border-color:var(--line);border-bottom-color:var(--blue);box-shadow:inset 0 -1px 0 var(--blue)}
.f>label,.f>.fl{font-size:14px;font-weight:600}
.seg{border-radius:4px;background:var(--hover)} .seg button{border-radius:4px;font-size:14px}
.choice{border-radius:8px;border:1px solid var(--line)} .choice.on{border:2px solid var(--blue);padding:11px}
.chip{border-radius:4px}
.switch{width:40px;height:20px;border-radius:10px;background:transparent;border:1px solid #616161} .switch::after{top:3px;left:3px;width:12px;height:12px;background:#616161;box-shadow:none}
.switch:checked{background:var(--blue);border-color:var(--blue)} .switch:checked::after{left:23px;background:#fff}
html.dk .switch{border-color:#ADADAD} html.dk .switch::after{background:#ADADAD} html.dk .switch:checked::after{background:#1F2B4B}
.chk{border-radius:4px;border:1px solid #616161;width:18px;height:18px}
/* pestañas */
.tabs{border-bottom:0;gap:0;padding:0 8px}
.tabs button{position:relative;border-bottom:0;padding:12px 12px;font-weight:400;color:var(--muted)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:2px;background:var(--blue)}
.tabs button:hover{color:var(--ink);background:transparent}
/* tablas y listas */
th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line-2)}
td{border-bottom:1px solid var(--line-2);padding:10px 8px}
.rowi{border-radius:4px}
.metric{border-radius:4px;background:var(--bg)}
.pill{border-radius:999px;font-weight:600}
.alert{border-radius:8px}
.track{height:6px;border-radius:3px} .track i{border-radius:3px}
/* menús, diálogos y avisos */
#pop{border-radius:8px;border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
.opt{border-radius:4px;padding:6px 10px;min-height:32px}
.dlg{border-radius:8px;box-shadow:0 0 8px rgba(0,0,0,.12),0 32px 64px rgba(0,0,0,.14)}
.dlg-h{justify-content:flex-start;padding:20px 56px 8px 24px;border-bottom:0;min-height:0}
.dlg-h h2{text-align:left;font-size:20px;line-height:28px;font-weight:600}
.dlg-h .rbtn{top:14px;right:16px;background:transparent;width:32px;height:32px;border-radius:4px}
.dlg-h .rbtn:hover{background:var(--hover)}
.dlg-b{padding:12px 24px 16px}
.dlg-f{padding:12px 24px 24px;border-top:0}
#modal{background:rgba(0,0,0,.4)}
.toast{border-radius:8px;border:1px solid var(--line-2)}
.toast.simple{background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg);border-left:4px solid var(--blue)}
.composer .cp{border-radius:4px;background:var(--bg);border:1px solid var(--line-2)}
.quick button{border-radius:4px;color:var(--ink);font-weight:600}
/* lanzador */
.launcher{width:min(372px,calc(100vw - 24px));padding:16px;max-height:min(640px,80vh);overflow-y:auto}
.ln-h{display:flex;align-items:center;gap:8px;margin-bottom:8px} .ln-h b{font-size:16px} .ln-h .note{margin-left:auto}
.ln-sec{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.ln-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ln-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;background:transparent;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;color:var(--ink);text-align:center;line-height:1.25}
.ln-app:hover{background:var(--hover)}
.ln-cur{display:flex;align-items:center;gap:12px;padding:10px;border-radius:6px;background:var(--hover);color:var(--ink)!important;text-decoration:none!important;margin-bottom:4px}.ln-cur b{display:block}
.ln-app{position:relative;text-decoration:none!important}.ln-app.dim{opacity:.6}.ln-app.add{border:1px dashed var(--line);color:var(--muted)}.ln-app.add svg.i{width:28px;height:28px;margin:6px}
.ln-x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer}.ln-x svg.i{width:12px;height:12px}
.ln-grid.icons{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}.ln-grid.icons .ln-app{padding:8px}.ln-grid.icons .ln-app.on{background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}
.ln-app span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* acceso */
.auth-brand{background:linear-gradient(150deg,#1F2B4B 0%,#253A57 55%,#2E5B33 100%)}
.otp input{border-radius:4px;border-bottom:2px solid #616161}
@media (max-width:820px){aside.side{box-shadow:none}body.nav-open aside.side{box-shadow:var(--shadow-lg)}.mob-only{display:grid!important}.waffle{display:none!important}.topbar .crumbs,.topbar .tb-sep{display:none}}
@media (max-width:640px){.wordmark span{display:none}}

/* ---------- formularios más aireados + ayuda con ícono (i) ---------- */
.form{gap:20px 22px;align-items:end}
.f{gap:8px}
.f>label,.f>.fl{font-size:14px;font-weight:600;line-height:1.3;gap:6px;min-height:20px}
.inp,.ui-trigger,.ui-money{height:44px;font-size:15px;padding:0 14px;border-radius:8px}
.ui-money{padding:0 0 0 14px}.ui-money input{padding-right:14px}
textarea.inp{padding:12px 14px}
.dlg{width:min(700px,100%)}
.dlg-b{padding:20px 28px 26px;gap:22px}
.dlg-f{padding:16px 28px!important;gap:10px}
.card .form{margin-top:4px}
.finfo{all:unset;box-sizing:border-box;flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--muted);cursor:help;transition:color .15s,background .15s}
.finfo svg.i,.finfo svg{width:16px;height:16px}
.finfo:hover,.finfo:focus-visible{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.finfo:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tip:hover::after,.tip:focus::after{display:none!important}
#ftip{position:fixed;z-index:9999;left:0;top:0;background:#1F2B4B;color:#fff;font-size:13px;line-height:1.45;font-weight:400;padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;width:max-content}
#ftip.on{opacity:1;transform:none}
#ftip::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1F2B4B}
#ftip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#1F2B4B}
@media (max-width:640px){.form{gap:16px}.dlg-b{padding:16px 18px 20px}.dlg-f{padding:14px 18px!important}}

/* ---------- descripción de ventanas ---------- */
.dlg-ht{min-width:0;flex:1}.dlg .dlg-h{padding-left:28px}.dlg-h{align-items:flex-start!important}
.dlg-d{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--muted);font-weight:400;max-width:60ch}
/* ---------- segunda ventana (crear categoría) ---------- */
#modal2{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
#modal2.show{display:flex;animation:fin .15s ease-out}
#modal2 .dlg{width:min(520px,100%)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.ai-box{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:linear-gradient(120deg,color-mix(in srgb,#9EDB4E 16%,var(--card)),color-mix(in srgb,#1F2B4B 8%,var(--card)));border:1px solid color-mix(in srgb,#3F7A1E 22%,transparent)}
.ai-box>svg{width:22px;height:22px;color:#3F7A1E;flex:none}.ai-box>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}.ai-box b{color:var(--ink);font-size:14px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- pie del desplegable: crear ---------- */
.pop-foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-2);padding:6px}
.pf-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.pf-btn:hover,.pf-btn:focus-visible{background:var(--line-2)}.pf-btn svg{width:16px;height:16px;color:var(--blue)}
.pf-btn.ai svg{color:#3F7A1E}
#tvHint{display:flex;gap:6px;align-items:center}#tvHint svg{width:14px;height:14px;color:#3F7A1E;flex:none}
/* ---------- notificaciones ---------- */
#toasts{left:auto!important;right:max(16px,env(safe-area-inset-right,0px));bottom:auto!important;top:68px;flex-direction:column!important;z-index:90!important;max-width:min(400px,calc(100vw - 32px))!important;width:400px;gap:10px!important}
.toast.tx{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;padding:14px 12px 16px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line-2);border-left:0;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06),0 16px 40px rgba(15,23,42,.16);animation:txin .28s cubic-bezier(.2,.9,.3,1.2)}
.toast.tx.out{animation:txout .2s ease-in forwards}
@keyframes txin{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes txout{to{opacity:0;transform:translateX(24px)}}
.tx-i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.tx-i svg{width:19px;height:19px}
.tx-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.45;color:var(--muted)}.tx-b b{color:var(--ink);font-size:14.5px;font-weight:650}
.tx-a{display:flex;gap:8px;margin-top:6px}
.tx-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:600;background:var(--line-2);color:var(--ink)}.tx-btn:hover{filter:brightness(.95)}.tx-btn svg{width:15px;height:15px}
.tx-x{all:unset;cursor:pointer;flex:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted);margin:-4px -2px 0 0}.tx-x:hover{background:var(--line-2);color:var(--ink)}.tx-x svg{width:16px;height:16px}
.tx-p{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;animation:txp linear forwards}.toast.paused .tx-p{animation-play-state:paused}
@keyframes txp{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.t-success .tx-i{background:color-mix(in srgb,#16A34A 14%,transparent);color:#16A34A}.t-success .tx-p{background:#16A34A}
.t-warn .tx-i{background:color-mix(in srgb,#E8A100 18%,transparent);color:#C27C00}.t-warn .tx-p{background:#E8A100}
.t-error .tx-i{background:color-mix(in srgb,#DC2626 14%,transparent);color:#DC2626}.t-error .tx-p{background:#DC2626}
.t-del .tx-i{background:color-mix(in srgb,#DC2626 12%,transparent);color:#DC2626}.t-del .tx-p{background:#DC2626}.t-del .tx-btn{background:#1F2B4B;color:#fff}
.t-info .tx-i{background:color-mix(in srgb,#1F2B4B 12%,transparent);color:#1F2B4B}.t-info .tx-p{background:#1F2B4B}
html.dk .t-info .tx-i{color:#9EB4FF}html.dk .t-del .tx-btn{background:#9EDB4E;color:#10210A}
@media (max-width:640px){#toasts{right:12px!important;left:12px!important;width:auto;top:calc(60px + env(safe-area-inset-top,0px))}}

.addr-chip{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}.addr-chip svg{width:15px;height:15px;color:#3F7A1E;flex:none}.addr-chip b{color:var(--ink);font-weight:600}

/* ---------- detalle de préstamo ---------- */
.ld{display:flex;flex-direction:column;gap:18px}
.ld-head{display:flex;gap:14px;align-items:flex-start}.ld-ht{flex:1;min-width:0}.ld-ht h2{margin:0 0 6px;font-size:20px}
.ld-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--line-2);font-size:12.5px;color:var(--ink);font-weight:500}.tag svg{width:13px;height:13px;color:var(--muted)}
.ld-now{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:12px;border:1px solid}
.ld-now.bad{background:color-mix(in srgb,#E5484D 8%,var(--card));border-color:color-mix(in srgb,#E5484D 30%,transparent)}
.ld-now.warn{background:color-mix(in srgb,#F2B233 10%,var(--card));border-color:color-mix(in srgb,#F2B233 35%,transparent)}
.ld-now.info{background:color-mix(in srgb,#2F6FED 6%,var(--card));border-color:color-mix(in srgb,#2F6FED 22%,transparent)}
.ld-now.ok{background:color-mix(in srgb,#16A34A 8%,var(--card));border-color:color-mix(in srgb,#16A34A 30%,transparent);justify-content:flex-start}.ld-now.ok>svg{width:28px;height:28px;color:#16A34A}.ld-now.ok div{display:flex;flex-direction:column}
.ld-now-l{display:flex;flex-direction:column;gap:2px;min-width:0}.ld-k{font-size:13.5px;font-weight:600;color:var(--muted)}.ld-big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}

function fijoStatus(f){const t=today(),out=[];const [dy,dm]=(f.desde||mkey(t)).split('-').map(Number);const start=new Date(Math.max(new Date(dy,dm-1,1),new Date(t.getFullYear(),t.getMonth()-3,1)));

function fijoProxIso(f){if(f&&f.id){const st=fijoStatus(f);const p=st.venc[0]||st.prox;if(p)return iso(p.due)}return iso(addDays(today(),10))}

function gastoVariableReal(){const t=today();let tot=0,n=0;for(let j=1;j<=3;j++){const k=mkey(addMonths(new Date(t.getFullYear(),t.getMonth(),1),-j));const g=gastosMesK(k).filter(x=>!x.fijoId);if(g.length){tot+=g.reduce((a,x)=>a+ +x.valor,0);n++}}return n?tot/n:variableMes()}

  if(x.tipo==='ahorro'){const g=x.capital*(Math.pow(1+x.tasa/100,trans/365)-1);return{bruto:g,ret:0,neto:g,valor:x.capital+g,final:null,venc:null,prog:null,ganHoy:g,mes:x.capital*(Math.pow(1+x.tasa/100,1/12)-1)}}

function totales(){const xc=S.cobrar.reduce((a,L)=>a+engine(L).saldo,0),xp=S.pagar.reduce((a,L)=>a+engine(L).saldo,0),xi=S.inversiones.reduce((a,x)=>a+conv(inv(x).valor,x.moneda),0);

function flujo(){const t=today(),out=[];let saldo=liquidez();const vm=variableMes();
  for(let k=0;k<12;k++){const a=new Date(t.getFullYear(),t.getMonth()+k,1),b=new Date(t.getFullYear(),t.getMonth()+k+1,0),inM=d=>d>=a&&d<=b;const det={ing:0,cob:0,cuo:0,fij:0,sub:0,var:vm};
    S.ingresos.forEach(x=>{const v=conv(x.valor,x.moneda);det.ing+=x.frec==='anual'?0:v*(FREC[x.frec]||0)});
    S.calendario.filter(c=>c.tipo==='ingreso'&&+c.monto>0&&parse(c.fecha).getMonth()===a.getMonth()).forEach(c=>det.ing+= +c.monto);
    S.cobrar.forEach(L=>engine(L).plan.forEach(r=>{if(inM(r.fecha))det.cob+=r.valor}));
    S.pagar.forEach(L=>engine(L).plan.forEach(r=>{if(inM(r.fecha)||(k===0&&r.fecha<a))det.cuo+=r.valor}));

/* ================= vistas ================= */

V.inicio=()=>{const SP=setupProgress();const setupBanner=!setupDone()?`<div class="card ai-card" style="flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap"><span class="ri t-green" style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center">${ic('rocket')}</span><div style="flex:1;min-width:200px"><b>Completa la puesta en marcha (${SP.done} de ${SP.total})</b><div class="note">Siguiente: ${SP.next?SP.next.t:''}</div><div class="track" style="margin-top:6px"><i style="width:${SP.done/SP.total*100}%;background:#9EDB4E"></i></div></div><button class="btn pri" data-go="puesta">Continuar${ic('arrow-right')}</button></div>`:'';const T=totales(),t=today(),H=hormigas(),q=quincena(t.getFullYear(),t.getMonth(),t.getDate()<=S.cfg.corteQ?'q1':'q2'),N=notifs().slice(0,4),Ag=agenda().filter(x=>x.d<=15).slice(0,6);const nombre=(S.perfil.nombre||'').split(' ')[0];
  const max=Math.max(...H.meses.map(m=>m.v),1);

    ${kpi('scale','t-blue','Lo que tienes menos lo que debes',$(T.pat),'Patrimonio neto',T.pat<0?'neg':'')}

      <div><h3>Sale <span class="pill bad">${$(q.Sa)}</span></h3>${q.sal.slice(0,5).map(x=>`<div class="tline"><span class="ti t-red">${ic(x.icon)}</span><span class="tn">${esc(x.n)}<small>${esc(x.s)}</small></span><span class="num">${$(x.v)}</span><span>${x.paid?ic('circle-check','pos'):''}</span></div>`).join('')||'<p class="note">Sin salidas.</p>'}${q.sal.length>5?`<p class="note">y ${q.sal.length-5} más…</p>`:''}</div></div>
      <div class="band" style="background:${q.disp>=0?'var(--green-soft)':'var(--red-soft)'}"><div><b>${q.disp>=0?'Te sobra':'Te falta'}</b><div class="note">Entradas menos salidas de la quincena</div></div><span class="bv ${q.disp>=0?'pos':'neg'}">${$(Math.abs(q.disp))}</span></div></div>
    <div class="grid" style="align-content:start">
      <div class="card ai-card"><div class="ph"><h2 style="display:flex;gap:10px;align-items:center">${isoIcon('consejero',32)}Consejero antes de gastar</h2></div><p class="note" style="font-size:14px">¿Vas a comprar algo, prestar plata o sacar un crédito? Cuéntame el valor y te digo si te alcanza, con base en tus ingresos y gastos.</p><button class="btn ai" data-go="consejero">${ic('wand-sparkles')}Preguntar al consejero</button></div>
      <div class="card"><div class="ph"><h2>Avisos</h2><button class="btn ghost sm" data-act="bell">Ver todos</button></div>${N.length?N.map(n=>`<a class="nitem" href="#${n.go}" style="padding:6px"><span class="ni ${n.bg}" style="width:40px;height:40px">${ic(n.icon)}</span><span class="nb"><b>${esc(n.t)}</b><br><span class="note">${esc(n.b)}</span></span></a>`).join(''):empty('circle-check','Todo al día. No tienes avisos.')}</div>
    </div>
  </section>

    <div class="card"><div class="ph"><h2>Metas</h2><a href="#metas">Ver</a></div><div class="bars">${S.metas.map(m=>bar(esc(m.nombre),m.ahorrado,m.objetivo,'#1F2B4B',pct(m.objetivo?m.ahorrado/m.objetivo:0,0),m.icon||'target')).join('')||empty('target','Aún no tienes metas.')}</div>
      <h2 style="margin-top:6px">Gasto hormiga</h2><svg viewBox="0 0 300 96" width="100%" role="img" aria-label="Gasto hormiga de los últimos seis meses">${H.meses.map((m,i)=>{const h=m.v/max*66;return `<rect x="${i*50+12}" y="${74-h}" width="26" height="${h}" rx="5" fill="${i===5?'#F7B928':'var(--line-2)'}"/><text x="${i*50+25}" y="90" text-anchor="middle" font-size="11" fill="var(--muted)">${m.l}</text>`}).join('')}</svg></div>

const agRow=x=>`<div class="rowi">${dateBox(x.fecha)}<div class="rb"><div class="rt">${esc(x.titulo)}</div><div class="rs">${esc(x.sub)} · <span class="pill ${x.st==='ok'?'gray':x.st}">${x.lbl}</span></div></div><div class="rv ${x.dir==='cobrar'?'pos':''}">${x.dir==='cobrar'?'+':''}${$(x.monto)}</div>${x.k==='fijo'?`<button class="btn sm soft" data-modal="pagarFijo" data-id="${x.id}" data-per="${x.per}">Pagar</button>`:x.k==='pagar'||x.k==='cobrar'?`<button class="btn sm soft" data-modal="pago" data-kind="${x.k}" data-id="${x.id}">${x.k==='cobrar'?'Cobrar':'Pagar'}</button>`:x.k==='sub'?`<button class="btn sm soft" data-act="subdone" data-id="${x.id}">Pagada</button>`:''}</div>`;

/* ---- balance y quincenas ---- */
let BAL={tab:'general',y:today().getFullYear(),m:today().getMonth()};
const PUC_A=[['1105','Efectivo','banknote'],['1110','Cuenta bancaria','landmark'],['1516','Inmueble (casa, lote)','house'],['1540','Vehículo','car'],['1995','Otro bien','tag']],PUC_P=[['2380','Tarjeta de crédito','credit-card'],['2381','Deuda informal','hand-coins'],['2408','Impuestos por pagar','receipt'],['2895','Otra deuda','tag']];
const pucIcon=c=>([...PUC_A,...PUC_P].find(x=>x[0]===c)||[0,0,String(c).startsWith('1')?'wallet':'receipt'])[2];
V.balance=()=>{const tabs=[['general','Lo que tengo y lo que debo','scale'],['q1','1ª quincena','calendar'],['q2','2ª quincena','calendar'],['mes','Mes completo','calendar-days']];

  if(BAL.tab==='general'){const T=totales();
    const line=(x,side)=>`<div class="tline"><span class="ti ${side==='activos'?'t-green':'t-red'}">${ic(x.icon||pucIcon(x.cod))}</span><span class="tn">${esc(x.nombre)}<small>${x.link?'Se calcula solo desde '+x.link:x.moneda&&x.moneda!=='COP'?`${fx(x.valor,x.moneda)} × ${$(S.cfg.trm[x.moneda])}`:'PUC '+esc(x.cod)}</small></span><span class="num">${$(x.link?x.valor:conv(x.valor,x.moneda))}</span>${x.link?'<span></span>':`<button class="btn icon sm ghost" data-act="del" data-col="${side}" data-id="${x.id}" aria-label="Eliminar">${ic('trash-2')}</button>`}</div>`;
    const act=[...S.activos,...(T.xi?[{nombre:'Inversiones',valor:T.xi,link:'Inversiones',icon:'trending-up'}]:[]),...(T.xc?[{nombre:'Lo que me deben',valor:T.xc,link:'Me deben',icon:'hand-coins'}]:[])];
    const pas=[...S.pasivos,...(T.xp?[{nombre:'Créditos y préstamos',valor:T.xp,link:'Le debo',icon:'landmark'}]:[])];
    body=`<div class="taccount"><div><h3>Lo que tengo <span class="lbl-s">ACTIVOS · DEBE</span></h3>${act.map(x=>line(x,'activos')).join('')||'<p class="note">Agrega tus cuentas, efectivo y bienes.</p>'}<div class="ttotal"><span>Total</span><span class="num pos">${$(T.A)}</span></div></div>
      <div><h3>Lo que debo <span class="lbl-s">PASIVOS · HABER</span></h3>${pas.map(x=>line(x,'pasivos')).join('')||'<p class="note">Sin deudas registradas.</p>'}<div class="ttotal"><span>Total</span><span class="num neg">${$(T.P)}</span></div></div></div>

  else{const q=quincena(BAL.y,BAL.m,BAL.tab);const it=(x,c)=>`<div class="tline"><span class="ti ${c}">${ic(x.icon)}</span><span class="tn">${esc(x.n)}<small>${esc(x.s)}</small></span><span class="num">${$(x.v)}</span><span>${x.paid?`<span class="pill ok">${ic('check')}Hecho</span>`:''}</span></div>`;
    body=`<div class="ph"><div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn icon sm" data-act="balm" data-d="-1" aria-label="Mes anterior">${ic('chevron-left')}</button><b style="text-transform:capitalize;min-width:140px;text-align:center">${MESL[BAL.m]} ${BAL.y}</b><button class="btn icon sm" data-act="balm" data-d="1" aria-label="Mes siguiente">${ic('chevron-right')}</button></div><span class="note">Del ${fshort(q.a)} al ${fshort(q.b)}</span></div>
      <section class="grid g3">${kpi('arrow-down-to-line','t-green','Entra',$(q.E),q.ent.length+' movimientos','pos')}${kpi('arrow-up-from-line','t-red','Sale',$(q.Sa),q.sal.length+' movimientos','neg')}${kpi('wallet',q.disp>=0?'t-blue':'t-red',q.disp>=0?'Te sobra':'Te falta',$(Math.abs(q.disp)),'Disponible del periodo',q.disp>=0?'':'neg')}</section>
      <div class="taccount"><div><h3>Entradas <span class="lbl-s">DEBE</span></h3>${q.ent.map(x=>it(x,'t-green')).join('')||'<p class="note">Sin entradas. Registra tus ingresos en Mi dinero › Ingresos.</p>'}<div class="ttotal"><span>Total</span><span class="num pos">${$(q.E)}</span></div></div><div><h3>Salidas <span class="lbl-s">HABER</span></h3>${q.sal.map(x=>it(x,'t-red')).join('')||'<p class="note">Sin salidas.</p>'}<div class="ttotal"><span>Total</span><span class="num neg">${$(q.Sa)}</span></div></div></div>`}
  return pageH('scale','b-green','Balance y quincenas','Mira lo que tienes y lo que debes, o cuánto entra y sale en cada quincena del mes.',BAL.tab==='general'?`<button class="btn pri" data-modal="activo">${ic('plus')}Agregar cuenta o bien</button>`:'')+

/* ---- gastos ---- */
let GMES=mkey(today());
V.gastos=()=>{const H=hormigas(),G=gastosMesK(GMES).sort((a,b)=>b.fecha.localeCompare(a.fecha)),tot=G.reduce((a,g)=>a+ +g.valor,0);const cats=Object.entries(H.porCat).sort((a,b)=>b[1].v-a[1].v),mx=Math.max(...cats.map(c=>c[1].v),1);
  const byDay={};G.forEach(g=>(byDay[g.fecha]=byDay[g.fecha]||[]).push(g));const mopts=[];for(let j=0;j<12;j++){const d=addMonths(new Date(today().getFullYear(),today().getMonth(),1),-j);mopts.push({v:mkey(d),l:`${MESL[d.getMonth()]} ${d.getFullYear()}`})}

  return pageH('receipt','b-red','Gastos y hormiga',`Todo lo que gastas. La IA detecta los gastos "hormiga": pequeños, frecuentes y evitables, que juntos suman mucho. También puedes marcarlos tú con el ícono de la taza.`,`<button class="btn" data-modal="gasto" data-foto="1">${ic('camera')}Foto de factura</button><button class="btn ai" data-act="reviewH">${ic('sparkles')}Revisar hormiga con IA</button><button class="btn pri" data-modal="gasto">${ic('plus')}Registrar gasto</button>`)+`
  <section class="grid g21"><div class="card"><div class="ph"><h2>Gastos hormiga de este mes</h2><span class="pill ${H.over?'warn':'ok'}">${H.over?'Sobre el límite':'En rango'}</span></div>
    <div class="grid g3" style="gap:10px"><div class="metric"><b>${$(H.totalMes)}</b><span>Llevas</span></div><div class="metric"><b>${$(H.proy)}</b><span>Proyección del mes</span></div><div class="metric"><b>${$(H.anual)}</b><span>En un año</span></div></div>
    <div class="bars">${cats.map(([c,o])=>bar(`${esc(c)} <span class="mut">×${o.n}</span>`,o.v,mx,'#F7B928',$(o.v),catIcon(c))).join('')||'<p class="note">Sin gastos hormiga este mes.</p>'}</div></div>
    <div class="grid" style="align-content:start">${al.join('')||alertBox('ok','circle-check','Sin alertas','Tus gastos pequeños están bajo control.')}</div></section>

    ${Object.entries(byDay).map(([d,l])=>`<div><div class="lbl-s" style="padding:6px 0">${relTime(parse(d))==='Hoy'||relTime(parse(d))==='Ayer'?relTime(parse(d))+' · ':''}${fdate(parse(d))}</div><div class="list">${l.map(g=>`<div class="rowi"><span class="ri ${isHormiga(g)?'t-amber':'t-gray'}">${ic(catIcon(g.cat))}</span><div class="rb"><div class="rt">${esc(g.desc)}</div><div class="rs">${esc(g.cat)} · ${esc(quienName(g.quien))}${g.medio?' · '+esc(g.medio):''}${isHormiga(g)?` <span class="pill warn" title="${esc(g.hormigaRazon||'')}">${g.hormigaSrc==='ia'?ic('sparkles'):g.hormigaSrc==='manual'?ic('pencil'):''}hormiga</span>`:''}${g.fijoId?' <span class="pill info">fijo</span>':''}</div></div><div class="rv">${$(g.valor)}</div>${g.fijoId?'':`<button class="btn icon sm ghost" data-act="toggleH" data-id="${g.id}" title="${isHormiga(g)?'Quitar de hormiga':'Marcar como hormiga'}" aria-label="${isHormiga(g)?'Quitar de hormiga':'Marcar como hormiga'}" style="${isHormiga(g)?'color:#D98300':''}">${ic('coffee')}</button>`}<button class="btn icon sm ghost" data-act="del" data-col="gastos" data-id="${g.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>`).join('')}</div></div>`).join('')||empty('receipt','No hay gastos en este mes.')}</div>`};

/* ---- suscripciones ---- */
function detectSubs(){const by={};S.gastos.filter(g=>!g.fijoId).forEach(g=>{const k=g.desc.toLowerCase().trim();(by[k]=by[k]||[]).push(g)});const names=S.suscripciones.map(s=>s.nombre.toLowerCase());const out=[];
  Object.entries(by).forEach(([k,l])=>{const ms=new Set(l.map(g=>g.fecha.slice(0,7)));if(ms.size<3)return;const vals=l.map(g=>+g.valor).sort((a,b)=>a-b),med=vals[Math.floor(vals.length/2)];if(vals.some(v=>Math.abs(v-med)>med*.15))return;if(l.length>ms.size*1.5)return;if(names.some(n=>k.includes(n)||n.includes(k)))return;out.push({desc:l[0].desc,valor:med,meses:ms.size,cat:l[0].cat})});return out}
V.suscripciones=()=>{const tot=subsMes(),D=detectSubs();

function pnum(s){s=String(s).replace(/[^\d,.\-]/g,'');if(!s)return NaN;const c=s.lastIndexOf(','),p=s.lastIndexOf('.');if(c>-1&&p>-1){s=c>p?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(c>-1){s=/,\d{1,2}$/.test(s)?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(p>-1&&/\.\d{3}(\.|$)/.test(s)&&!/\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
function pdate(s){s=String(s).trim();let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
const classify=desc=>{const d=desc.toLowerCase();const r=S.cfg.reglas.find(x=>x.k&&d.includes(x.k.toLowerCase()));return r?r.cat:'Otros'};
function parseCSV(txt){const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return{err:'El archivo está vacío.'};const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':(lines[0].includes('\t')?'\t':',');
  const split=l=>{const o=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){o.push(cur);cur='';continue}cur+=ch}o.push(cur);return o.map(x=>x.trim())};
  const rows=lines.map(split);const h=rows[0].map(x=>x.toLowerCase());let fi=h.findIndex(x=>/fecha|date/.test(x)),di=h.findIndex(x=>/desc|concepto|detalle|referencia|movimiento/.test(x)),vi=h.findIndex(x=>/valor|monto|importe|d[eé]bito|amount/.test(x));
  let start=1;if(fi<0||di<0||vi<0){if(pdate(rows[0][0])){fi=0;di=1;vi=rows[0].length-1;start=0}else return{err:'No encontré columnas de fecha, descripción y valor. Usa un encabezado como: Fecha;Descripción;Valor'}}
  const out=[];let skipped=0;for(let i=start;i<rows.length;i++){const r=rows[i];const f=pdate(r[fi]),v=pnum(r[vi]),de=r[di]||'';if(!f||!isFinite(v)){skipped++;continue}out.push({fecha:f,desc:de,valor:v,cat:classify(de),incl:v<0})}
  if(!out.some(o=>o.valor<0))out.forEach(o=>o.incl=true);out.forEach(o=>o.valor=Math.abs(o.valor));return{rows:out,skipped}}

  return pageH(isC?'hand-coins':'landmark',isC?'b-green':'b-red',isC?'Me deben':'Le debo',isC?'Personas o clientes que te deben dinero. Registra cada pago, sea la cuota exacta o un abono.':'Créditos con bancos y deudas con personas. Registra cada pago y mira cuánto te falta.',`${isC?'':`<button class="btn" data-act="empeno">${ic('gem')}Registrar empeño</button>`}<button class="btn pri" data-modal="loan" data-kind="${kind}">${ic('plus')}${isC?'Nuevo préstamo':'Nueva deuda'}</button>`)+`

let EX={extra:500000,abono:{id:null,v:2000000,modo:'plazo'}};
function sim(extra,order,roll=true){const D=S.pagar.map(L=>{const e=engine(L);return{n:loanName(L,'pagar')+(L.concepto?' · '+L.concepto:''),s:e.saldo,i:e.i,c:e.next?e.next.valor-(+L.extra||0):0}}).filter(d=>d.s>1);if(!D.length)return null;
  const budget=D.reduce((a,d)=>a+d.c,0)+extra;let m=0,ti=0;const pay={};const ord=[...D].sort(order);
  while(D.some(d=>d.s>1)&&m<600){m++;D.forEach(d=>{if(d.s>1){const int=d.s*d.i;d.s+=int;ti+=int}});let avl=budget;D.forEach(d=>{if(d.s>1){const p=Math.min(d.c,d.s);d.s-=p;avl-=p}});
    if(roll){avl=Math.max(avl,0);for(const o of ord){const d=D.find(x=>x.n===o.n);if(d.s>1&&avl>0){const p=Math.min(avl,d.s);d.s-=p;avl-=p}}}D.forEach(d=>{if(d.s<=1&&!pay[d.n])pay[d.n]=m})}
  return{m,ti,pay,ord:ord.map(o=>o.n)}}

  const base=sim(0,()=>0,false),ava=sim(+EX.extra,(a,b)=>b.i-a.i),bol=sim(+EX.extra,(a,b)=>a.s-b.s);
  if(!EX.abono.id||!S.pagar.find(p=>p.id===EX.abono.id))EX.abono.id=S.pagar[0].id;const L=S.pagar.find(x=>x.id===EX.abono.id);
  const e0=engine(L),L2=clone(L);L2.pagos.push({id:'sim',fecha:iso(today()),tipo:'abono',valor:EX.abono.v,modo:EX.abono.modo});const e1=engine(L2);

  return pageH('trending-down','b-amber','Salir de deudas','Si cada mes pones un poco más de plata a tus deudas, terminas antes y pagas menos intereses. Aquí comparas dos métodos.')+`
  <div class="card"><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(220px,max-content))">${field('¿Cuánto más puedes pagar al mes?',money('exE',EX.extra,{attrs:'data-ex="extra"'}),{hint:`Hoy pagas ${$(cuotasMes('pagar'))} en cuotas`})}</div>
    <div class="grid g3" style="gap:10px"><div class="metric"><b>${base.m} meses</b><span>Sin pagar extra</span></div><div class="metric"><b>${$(base.ti)}</b><span>Intereses sin pagar extra</span></div><div class="metric"><b class="pos">${ava.ti<=bol.ti?'Avalancha':'Bola de nieve'}</b><span>Método que más te conviene</span></div></div></div>
  <section class="grid g2">${card('Avalancha','zap',ava,'Pones el dinero extra a la deuda con el interés más alto. Es la que menos plata te cuesta.')}${card('Bola de nieve','sprout',bol,'Pones el dinero extra a la deuda más pequeña. Ves resultados rápido y te motiva a seguir.')}</section>
  <div class="card"><h2>¿Y si hago un abono extra a un crédito?</h2><div class="form">${field('Crédito',sel('abP',S.pagar.map(x=>({v:x.id,l:loanName(x,'pagar')+(x.concepto?' · '+x.concepto:''),icon:'landmark'})),EX.abono.id,{attrs:'data-ex="abono.id"'}))}${field('Valor del abono',money('abV',EX.abono.v,{attrs:'data-ex="abono.v"'}))}<div class="f"><span class="fl">¿Qué prefieres?</span><div class="seg">${pick('abmodo',[{v:'plazo',l:'Terminar antes'},{v:'cuota',l:'Pagar menos cada mes'}],EX.abono.modo,'')}</div></div></div>
    <div class="grid g4" style="gap:10px"><div class="metric"><b>${$(e0.saldo)} → ${$(e1.saldo)}</b><span>Lo que debes</span></div><div class="metric"><b>${e0.plan.length} → ${e1.plan.length}</b><span>Cuotas que faltan</span></div><div class="metric"><b>${e0.next?$(e0.next.valor):'—'} → ${e1.next?$(e1.next.valor):'—'}</b><span>Valor de la cuota</span></div><div class="metric"><b class="pos">${$(Math.max(e0.intTotal-e1.intTotal,0))}</b><span>Ahorro en intereses</span></div></div>
    <p class="note">Terminar antes casi siempre ahorra más intereses. Pagar menos cada mes te deja más plata libre. Cuando hagas el abono de verdad, regístralo en Le debo › Registrar pago › Abono.</p></div>`};

/* ---- presupuesto ---- */
V.presupuesto=()=>{const ing=ingresoMensual(),k=mkey(today()),G=gastosMesK(k),P=S.cfg.pct;const real=c=>G.filter(g=>g.cat.toLowerCase()===c.toLowerCase()).reduce((a,g)=>a+ +g.valor,0);
  const grupos=[['n','Necesidades','house',P.n,'#1F2B4B','Arriendo, mercado, servicios, transporte, salud'],['g','Gustos','coffee',P.g,'#9EDB4E','Restaurantes, salidas, ropa, suscripciones'],['a','Ahorro e inversión','piggy-bank',P.a,'#3F7A1E','Lo que guardas para el futuro']];
  const known=new Set(S.cfg.categorias.map(c=>c.nombre.toLowerCase()));const sin={};G.filter(g=>!known.has(g.cat.toLowerCase())).forEach(g=>sin[g.cat]=(sin[g.cat]||0)+ +g.valor);
  return pageH('chart-pie','b-violet','Presupuesto 50/30/20',`La regla más usada para organizar el sueldo: ${P.n}% para lo necesario, ${P.g}% para gustos y ${P.a}% para ahorrar. Con tu ingreso de ${$(ing)} queda así:`,`<button class="btn" data-go="ajustes" data-tab="cats">${ic('sliders-horizontal')}Editar categorías</button>`)+`
  <section class="grid g3">${grupos.map(([g,l,icon,p,c,d])=>{const items=S.cfg.categorias.filter(x=>x.grupo===g);const tope=items.reduce((a,x)=>a+ +x.tope,0),r=g==='a'?tope:items.reduce((a,x)=>a+real(x.nombre),0),ideal=ing*p/100;const st=g==='a'?(tope>=ideal?'ok':'warn'):(r<=ideal?'ok':r<=ideal*1.1?'warn':'bad');
    return `<div class="card"><div class="ph"><h3 style="display:flex;gap:8px;align-items:center">${ic(icon)}${l}</h3><span class="pill ${st}">${p}%</span></div><div class="kv num" style="font-size:22px;font-weight:800">${$(g==='a'?tope:r)}</div><div class="note">${g==='a'?'Planeado':'Gastado este mes'} · recomendado ${$(ideal)}</div><div class="track lg"><i style="width:${ideal?Math.min((g==='a'?tope:r)/ideal,1)*100:0}%;background:${c}"></i></div><div class="note">${d}</div></div>`}).join('')}</section>
  <div class="card"><div class="ph"><h2>Cada categoría este mes</h2><span class="note">Escribe cuánto quieres gastar como máximo en cada una</span></div><div class="tbl-wrap"><table><thead><tr><th>Categoría</th><th>Tipo</th><th style="min-width:160px">Tope al mes</th><th class="r">Llevas</th><th style="min-width:140px">Uso</th><th>Estado</th></tr></thead><tbody>
  ${S.cfg.categorias.map(c=>{const r=real(c.nombre),u=c.tope?r/c.tope:0,st=c.grupo==='a'?['vio','Ahorro']:!c.tope?['gray','Sin tope']:u<=.8?['ok','Bien']:u<=1?['warn','Cerca del tope']:['bad','Te pasaste'];return `<tr><td><span style="display:flex;gap:10px;align-items:center"><span class="ri t-gray" style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center">${ic(c.icon)}</span>${esc(c.nombre)}</span></td><td class="nw">${{n:'Necesidad',g:'Gusto',a:'Ahorro'}[c.grupo]}</td><td>${money('tope_'+c.id,c.tope||'',{attrs:`data-edit="cat|${c.id}|tope"`})}</td><td class="r num">${c.grupo==='a'?'—':$(r)}</td><td>${c.grupo==='a'||!c.tope?'':`<div class="track"><i style="width:${Math.min(u,1)*100}%;background:${u>1?'var(--red)':u>.8?'#E08A00':'var(--blue)'}"></i></div>`}</td><td>${stPill(st)}</td></tr>`}).join('')}
  ${Object.entries(sin).map(([c,v])=>`<tr><td>${esc(c)}</td><td colspan="2"><span class="note">No está en tus categorías</span></td><td class="r num">${$(v)}</td><td></td><td><span class="pill warn">Sin categoría</span></td></tr>`).join('')}</tbody></table></div></div>`};

/* ---- flujo ---- */
V.flujo=()=>{const F=flujo();const W=760,H=240,pad=50,bw=(W-pad)/12;const mx=Math.max(...F.map(f=>Math.max(f.I,f.E,f.saldo)),1),mn=Math.min(0,...F.map(f=>f.saldo));const y=v=>12+(H-34)*(1-(v-mn)/(mx-mn||1));
  const ticks=[0,.25,.5,.75,1].map(t=>mn+(mx-mn)*t);const neg=F.filter(f=>f.neto<0);
  return pageH('chart-line','b-violet','Flujo de caja','Cuánto te entra y cuánto te sale en los próximos 12 meses, y con cuánta plata quedarías al final de cada mes.')+`
  <section class="grid g4">${kpi('wallet','t-blue','Hoy tienes disponible',$(liquidez()),'Efectivo, bancos y ahorros')}${kpi('arrow-down-to-line','t-green','Te sobra en promedio',$(F.reduce((a,f)=>a+f.neto,0)/12),'Por mes')}${kpi('flag',F[11].saldo>=0?'t-green':'t-red','En 12 meses tendrías',$(F[11].saldo),'Si todo sale como lo planeas',F[11].saldo<0?'neg':'')}${kpi('triangle-alert',neg.length?'t-red':'t-green','Meses en rojo',String(neg.length),neg.length?neg.map(f=>f.l).join(', '):'Ninguno',neg.length?'neg':'')}</section>
  <div class="card"><div class="ph"><h2>Mes a mes</h2><div class="legend"><span><i style="background:#9EDB4E"></i>Entra</span><span><i style="background:#E41E3F"></i>Sale</span><span><i style="background:#1F2B4B"></i>Te queda acumulado</span></div></div>
  <div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:620px;width:100%" role="img" aria-label="Flujo de caja de 12 meses">${ticks.map(t=>`<line x1="${pad}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-2)"/><text x="${pad-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(t/1e6).toFixed(0)}M</text>`).join('')}
   ${F.map((f,i)=>{const x=pad+i*bw;return `<rect x="${x+bw*.14}" y="${y(f.I)}" width="${bw*.34}" height="${Math.max(y(0)-y(f.I),0)}" rx="3" fill="#9EDB4E"/><rect x="${x+bw*.52}" y="${y(f.E)}" width="${bw*.34}" height="${Math.max(y(0)-y(f.E),0)}" rx="3" fill="#E41E3F" opacity=".85"/><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${f.l}</text>`}).join('')}
   <polyline fill="none" stroke="var(--navy)" stroke-width="2.5" points="${F.map((f,i)=>`${pad+i*bw+bw/2},${y(f.saldo)}`).join(' ')}"/>${F.map((f,i)=>`<circle cx="${pad+i*bw+bw/2}" cy="${y(f.saldo)}" r="${i===11?5:3}" fill="var(--navy)"/>`).join('')}</svg></div></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Te pagan</th><th class="r">Cuotas</th><th class="r">Gastos fijos</th><th class="r">Suscripciones</th><th class="r">Variables</th><th class="r">Resultado</th><th class="r">Acumulado</th></tr></thead><tbody>
  ${F.map(f=>`<tr><td>${f.l}</td><td class="r num">${$(f.det.ing)}</td><td class="r num">${$(f.det.cob)}</td><td class="r num">${$(f.det.cuo)}</td><td class="r num">${$(f.det.fij)}</td><td class="r num">${$(f.det.sub)}</td><td class="r num">${$(f.det.var)}</td><td class="r num ${f.neto>=0?'pos':'neg'}"><b>${$(f.neto)}</b></td><td class="r num">${$(f.saldo)}</td></tr>`).join('')}</tbody></table></div><p class="note">Las primas y otros ingresos extra se suman en su mes si escribes el valor en el Calendario fiscal.</p></div>`};

/* ---- metas ---- */
V.metas=()=>{const I=indicadores()[2],F=S.fondo||{saldo:0,mov:[]},liq=F.on?F.saldo:liquidez(),obj=gastosBasicos()*S.cfg.emergMeta;
  return pageH('piggy-bank','b-violet','Metas y fondo de emergencia','Ponle nombre y fecha a lo que quieres lograr y te decimos cuánto guardar cada mes.',`<button class="btn pri" data-modal="meta">${ic('plus')}Nueva meta</button>`)+`
  <div class="card"><div class="ph"><h2 style="display:flex;gap:8px;align-items:center">${ic('umbrella')}Fondo de emergencia</h2>${I.ok?`<span class="pill ${I.st}">${I.v}</span>`:'<span class="pill gray">Faltan datos</span>'}</div><p class="note" style="font-size:14px">Es un colchón para imprevistos (perder el trabajo, una enfermedad, un daño en la casa). Lo recomendado es tener guardados ${S.cfg.emergMeta} meses de tus gastos básicos.</p>
    <div class="grid g3" style="gap:10px"><div class="metric"><b>${$(liq)}</b><span>${F.on?'Tienes guardado en el fondo':'Tienes disponible (todas tus cuentas)'}</span></div><div class="metric"><b>${$(obj)}</b><span>Meta (${S.cfg.emergMeta} meses)</span></div><div class="metric"><b class="${liq>=obj?'pos':'neg'}">${$(Math.max(obj-liq,0))}</b><span>Te falta</span></div></div><div class="track lg"><i style="width:${obj?Math.min(liq/obj,1)*100:0}%;background:#9EDB4E"></i></div>${fondoBlock()}</div>
  <section class="grid g2">${S.metas.map(m=>{const falta=Math.max(m.objetivo-m.ahorrado,0),meses=Math.max(1,(parse(m.fecha).getFullYear()-today().getFullYear())*12+parse(m.fecha).getMonth()-today().getMonth()),r=m.objetivo?m.ahorrado/m.objetivo:0;
    return `<div class="card"><div class="ph"><h2 style="display:flex;gap:10px;align-items:center"><span class="ri t-violet" style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center">${ic(m.icon||'target')}</span>${esc(m.nombre)}</h2><button class="btn icon sm ghost" data-act="del" data-col="metas" data-id="${m.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>
    <div><span class="kv num" style="font-size:22px;font-weight:800">${$(m.ahorrado)}</span> <span class="note">de ${$(m.objetivo)}</span></div><div class="track lg"><i style="width:${Math.min(r,1)*100}%;background:#1F2B4B"></i></div>
    <div class="grid g3" style="gap:8px"><div class="metric"><b>${pct(r,0)}</b><span>Avance</span></div><div class="metric"><b>${fshort(parse(m.fecha))}</b><span>Fecha</span></div><div class="metric"><b class="${falta?'':'pos'}">${falta?$(falta/meses):'¡Lograda!'}</b><span>${falta?'Guarda al mes':''}</span></div></div>
    ${aporteRow({t:'meta',id:m.id},falta?Math.ceil(falta/meses/1000)*1000:0,!!falta)}
    ${falta?`<form data-form="abonometa" data-id="${m.id}" style="display:flex;gap:8px"><div style="flex:1">${money('v','',{ph:'¿Cuánto guardaste?',req:true})}</div><button class="btn pri">${ic('plus')}Abonar</button></form>`:''}</div>`}).join('')||`<div class="card">${empty('target','Aún no tienes metas.',`<button class="btn pri" data-modal="meta">${ic('plus')}Crear meta</button>`)}</div>`}</section>`};

/* ---- por miembro ---- */
V.familia=()=>{const k=mkey(today()),G=gastosMesK(k),M=S.perfil.miembros;const rows=M.map(m=>({m,g:G.filter(x=>x.quien===m.id).reduce((a,x)=>a+ +x.valor,0),ap:S.ingresos.filter(i=>i.quien===m.id).reduce((a,i)=>a+conv(i.valor,i.moneda)*(FREC[i.frec]||0),0)}));
  const comun=G.filter(x=>x.quien==='familia').reduce((a,x)=>a+ +x.valor,0),apT=rows.reduce((a,r)=>a+r.ap,0)||1;

  <section class="grid g3">${rows.map(({m,g})=>{const u=m.cupo?g/m.cupo:0,st=u<=.8?'ok':u<=1?'warn':'bad';return `<div class="card"><div style="display:flex;gap:12px;align-items:center">${av(m.nombre)}<div><h3>${esc(m.nombre)}</h3><div class="note">${esc(m.rol)}</div></div><span class="pill ${st}" style="margin-left:auto">${pct(u,0)}</span></div><div><span class="kv num" style="font-size:20px;font-weight:800">${$(g)}</span> <span class="note">de ${$(m.cupo)}</span></div><div class="track lg"><i style="width:${Math.min(u,1)*100}%;background:${st==='bad'?'var(--red)':st==='warn'?'#E08A00':'#9EDB4E'}"></i></div>${field('Presupuesto al mes',money('cupo_'+m.id,m.cupo,{attrs:`data-edit="miembros|${m.id}|cupo"`}))}</div>`}).join('')}</section>
  <section class="grid g2"><div class="card"><h2>Lo que aporta cada uno</h2><div class="bars">${rows.map(r=>bar(esc(r.m.nombre),r.ap,apT,'#3F7A1E',`${$(r.ap)} · ${pct(r.ap/apT,0)}`)).join('')}</div><p class="note">Según los ingresos asignados a cada integrante.</p></div>
  <div class="card"><h2>Gastos compartidos: ${$(comun)}</h2><p class="note">Si los reparten según lo que gana cada uno, a cada quien le toca:</p><div class="list">${rows.map(r=>`<div class="rowi">${av(r.m.nombre,'sm')}<div class="rb"><div class="rt">${esc(r.m.nombre)}</div></div><div class="rv">${$(comun*r.ap/apT)}</div></div>`).join('')}</div></div></section>`:`<div class="card">${empty('users','Agrega los integrantes de tu familia en tu perfil.',`<button class="btn pri" data-go="perfil">Ir a Perfil</button>`)}</div>`)};

/* ---- inversiones ---- */
const INVT={cdt:{l:'CDT',icon:'landmark',ib:'t-blue',d:'Le prestas tu dinero al banco por un tiempo fijo y te devuelve más. Seguro y sabes desde el inicio cuánto ganas.'},ahorro:{l:'Cuenta o bolsillo que rinde',icon:'piggy-bank',ib:'t-green',d:'Tu plata gana intereses cada día y la puedes sacar cuando quieras (Nu, Lulo, bolsillos, cuentas de alto rendimiento).'},fondo:{l:'Fondo de inversión',icon:'layers',ib:'t-violet',d:'Juntas tu dinero con el de otras personas y expertos lo invierten. Puede subir o bajar.'},acciones:{l:'Acciones o ETF',icon:'chart-line',ib:'t-amber',d:'Compras una parte de empresas. A largo plazo suelen crecer, pero su valor cambia todos los días.'},cripto:{l:'Criptomonedas',icon:'coins',ib:'t-red',d:'Muy riesgosas: su valor puede subir o caer mucho en poco tiempo.'},otro:{l:'Otra inversión',icon:'briefcase',ib:'t-gray',d:'Un negocio, un lote, ganado u otra inversión que quieras seguir.'}};
let ISIM={c:10000000,t:9.5,d:360};
V.inversiones=()=>{const rows=S.inversiones.map(x=>({x,r:inv(x)}));const tot=rows.reduce((a,o)=>a+conv(o.r.valor,o.x.moneda),0),cap=rows.reduce((a,o)=>a+conv(o.x.capital,o.x.moneda),0);
  const sb=ISIM.c*(Math.pow(1+ISIM.t/100,ISIM.d/365)-1),sr=sb*.04;
  return pageH('trending-up','b-teal','Inversiones','Mira cuánto está creciendo tu dinero, explicado sin palabras raras.',`<button class="btn pri" data-modal="inversion">${ic('plus')}Agregar inversión</button>`)+`
  <section class="grid g3">${kpi('wallet','t-blue','Tu dinero invertido vale hoy',$(tot),'Pusiste '+$(cap))}${kpi('trending-up',tot>=cap?'t-green':'t-red','Has ganado',$(tot-cap),pct(cap?(tot-cap)/cap:0)+' sobre lo que pusiste',tot>=cap?'pos':'neg')}${kpi('calendar','t-amber','Próximo vencimiento',(()=>{const v=rows.filter(o=>o.r.venc&&o.r.venc>=today()).sort((a,b)=>a.r.venc-b.r.venc)[0];return v?fdate(v.r.venc):'—'})(),'Te avisamos 10 días antes')}</section>
  <section class="grid g2">${rows.map(({x,r})=>{const T=INVT[x.tipo]||INVT.otro;return `<div class="card"><div class="ph"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="ri ${T.ib}" style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center">${ic(T.icon)}</span><div style="min-width:0"><h3>${esc(x.nombre)}</h3><div class="note">${T.l} · ${esc(entName(x.entidad)||'')}</div></div></div><button class="btn icon sm ghost" data-act="del" data-col="inversiones" data-id="${x.id}" aria-label="Eliminar">${ic('trash-2')}</button></div>
    <div class="grid g2" style="gap:8px"><div class="metric"><b>${fx(x.capital,x.moneda)}</b><span>Pusiste</span></div><div class="metric"><b class="pos">${fx(r.valor,x.moneda)}</b><span>Vale hoy</span></div></div>
    ${x.tipo==='cdt'?`<div><div class="track lg"><i style="width:${r.prog*100}%;background:#9EDB4E"></i></div><div class="note" style="margin-top:4px">${r.rest?`Faltan ${r.rest} días · vence el ${fdate(r.venc)}`:'¡Ya venció! Decide si lo renuevas o retiras.'}</div></div>
      <div class="preview" style="background:var(--field)"><span>Al final recibirás <b>${$(r.final)}</b>: ganas <b class="pos">${$(r.bruto)}</b> y el banco descuenta <b>${$(r.ret)}</b> de retención en la fuente ${tip('Es un impuesto que el banco cobra por adelantado sobre lo que ganas: 4% de los rendimientos. Lo puedes descontar en tu declaración de renta.')}.</span><span class="note">Equivale a unos ${$(r.mes)} por mes · tasa ${x.tasa}% E.A.</span></div>`

V.indicadores=()=>{const I=indicadores(),A=I.filter(i=>i.ok),sc=A.length?Math.round(A.reduce((a,i)=>a+(i.st==='ok'?100:i.st==='warn'?60:20),0)/A.length):0,comp=A.length/I.length;
  const lvl=sc>=80?['ok','Muy sana','thumbs-up']:sc>=55?['warn','Hay cosas por mejorar','triangle-alert']:['bad','Necesita atención','circle-alert'];
  const faltan=[...new Set(I.filter(i=>!i.ok).flatMap(i=>i.falta))];const head=A.length>=4?`<div class="card"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Puntaje ${sc} de 100"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line-2)" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="${lvl[0]==='ok'?'#9EDB4E':lvl[0]==='warn'?'#E08A00':'#C8213B'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${sc*3.1416} 400" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">${sc}</text><text x="60" y="78" text-anchor="middle" font-size="12" fill="var(--muted)">de 100</text></svg>
    <div style="flex:1;min-width:220px"><div class="lbl-s">Tu salud financiera</div><h2 style="font-size:22px;display:flex;gap:8px;align-items:center">${ic(lvl[2])}${lvl[1]}</h2><p class="note" style="font-size:14px">Calculada con ${A.length} de ${I.length} indicadores${A.length<I.length?'. Completa los datos que faltan para ver el resultado completo':' y tus datos reales'}.</p><div class="track" style="margin-top:8px"><i style="width:${comp*100}%;background:#1F2B4B"></i></div><div class="note" style="margin-top:4px">Datos completos: ${pct(comp,0)}</div></div></div></div>`
    :`<div class="card"><div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap"><span class="ri t-gray" style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center">${ic('gauge')}</span><div style="flex:1;min-width:220px"><h2>Todavía no puedo darte un puntaje confiable</h2><p class="note" style="font-size:14px">Para que el resultado sea exacto necesito al menos 4 de los 6 indicadores. Hoy tengo ${A.length}. Me falta registrar:</p><ul class="clean" style="margin-top:6px">${faltan.map(f=>`<li>${f}</li>`).join('')}</ul><div class="track" style="margin-top:10px"><i style="width:${comp*100}%;background:#1F2B4B"></i></div><div class="note" style="margin-top:4px">Datos completos: ${pct(comp,0)}</div></div></div></div>`;
  return pageH('gauge','b-pink','Salud financiera','Seis preguntas que se hacen los asesores para saber si las finanzas de un hogar están sanas. Solo mostramos un resultado cuando tienes los datos necesarios para que sea exacto.')+head+`
  <section class="grid g3">${I.map(i=>i.ok?`<div class="card"><div class="ph"><span class="ri ${i.st==='ok'?'t-green':i.st==='warn'?'t-amber':'t-red'}" style="width:40px;height:40px;border-radius:50%;display:grid;place-items:center">${ic(i.icon)}</span><span class="pill ${i.st}">${i.st==='ok'?'Sano':i.st==='warn'?'Vigilar':'En riesgo'}</span></div><h3>${i.k}</h3><div class="kv num" style="font-size:26px;font-weight:800">${i.v}</div><div class="track lg"><i style="width:${Math.min(i.r/i.max,1)*100}%;background:${i.st==='ok'?'#9EDB4E':i.st==='warn'?'#E08A00':'var(--red)'}"></i></div><div class="note"><b>${i.meta}.</b> ${i.d}</div></div>`
    :`<div class="card" style="border:1.5px dashed var(--line);box-shadow:none"><div class="ph"><span class="ri t-gray" style="width:40px;height:40px;border-radius:50%;display:grid;place-items:center">${ic(i.icon)}</span><span class="pill gray">Faltan datos</span></div><h3>${i.k}</h3><p class="note" style="font-size:14px">Para calcularlo con exactitud necesito ${i.falta.join(' y ')}.</p><div><button class="btn soft sm" data-go="${i.go}">${ic('plus')}Completar</button></div></div>`).join('')}</section>`};

let RPT=mkey(today());
function reportData(k){const T=totales(),G=gastosMesK(k),grp={n:0,g:0,a:0,x:0};G.forEach(g=>{grp[catOf(g.cat)?.grupo||'x']+= +g.valor});const ing=ingresoMensual(),cuo=cuotasMes('pagar'),sub=subsMes(),gas=G.reduce((a,g)=>a+ +g.valor,0);const cats={};G.forEach(g=>cats[g.cat]=(cats[g.cat]||0)+ +g.valor);return{T,ing,cuo,sub,gas,grp,res:ing-cuo-sub-gas,cats:Object.entries(cats).sort((a,b)=>b[1]-a[1])}}
V.reportes=()=>{const R=reportData(RPT),[yy,mm]=RPT.split('-').map(Number);const mopts=[];for(let j=0;j<12;j++){const d=addMonths(new Date(today().getFullYear(),today().getMonth(),1),-j);mopts.push({v:mkey(d),l:`${MESL[d.getMonth()]} ${d.getFullYear()}`})}

  <div class="card"><h2>Resultado del mes</h2><div class="tbl-wrap"><table><tbody>${row('Ingresos',R.ing,'pos')}${row('Necesidades',R.grp.n)}${row('Gustos',R.grp.g)}${row('Otros gastos',R.grp.x+R.grp.a)}${row('Cuotas de créditos',R.cuo)}${row('Suscripciones',R.sub)}</tbody><tfoot><tr><td>${R.res>=0?'Te sobró':'Te faltó'}</td><td class="r num ${R.res>=0?'pos':'neg'}">${$(R.res)}</td></tr></tfoot></table></div><div class="bars">${R.cats.slice(0,6).map(([c,v])=>bar(esc(c),v,R.cats[0][1],'#1F2B4B',$(v),catIcon(c))).join('')}</div></div></section>`};

function localCat(desc){const d=norm(desc);if(d.length<2)return null;
  const r=S.cfg.reglas.find(x=>x.k&&d.includes(norm(x.k)));if(r&&catOf(r.cat))return{cat:catOf(r.cat).nombre,src:'regla'};
  const hist=[...S.gastos].reverse().find(g=>{const n=norm(g.desc);return n===d||(d.length>=4&&(n.startsWith(d)||d.startsWith(n)))});if(hist&&catOf(hist.cat))return{cat:catOf(hist.cat).nombre,src:'historial'};
  for(const [c,re] of Object.entries(KW)){if(catOf(c)&&new RegExp(re).test(d))return{cat:catOf(c).nombre,src:'palabras'}}
  for(const c of S.cfg.categorias){if(norm(c.nombre).length>3&&d.includes(norm(c.nombre)))return{cat:c.nombre,src:'palabras'}}
  return null}
function localHormiga(g){if(g.fijoId)return false;const v=+g.valor||0,c=catOf(g.cat),d=norm(g.desc);if(v>S.cfg.umbral*2)return false;if(c&&(c.grupo==='a'||['Vivienda','Servicios públicos','Educación','Salud'].includes(c.nombre)))return false;if(HKW.test(d))return true;if(v<=S.cfg.umbral&&c&&c.grupo==='g')return true;return v<=S.cfg.umbral&&!c}
function isHormiga(g){if(!g||g.fijoId)return false;if(typeof g.hormiga==='boolean')return g.hormiga;return localHormiga(g)}
const vecesMes=desc=>{const d=norm(desc),lim=iso(addDays(today(),-30));return S.gastos.filter(g=>g.fecha>=lim&&norm(g.desc)===d).length};
const AICACHE={};
async function aiClassify(items){let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}if(!sample||!items.length)return null;
  const cats=S.cfg.categorias.map(c=>`${c.nombre} (${{n:'necesidad',g:'gusto',a:'ahorro'}[c.grupo]})`);
  const prompt=`Clasificas gastos de una familia colombiana (valores en pesos COP).
Categorías disponibles (usa el nombre EXACTO, sin el paréntesis): ${cats.join('; ')}.
"Gasto hormiga": gasto pequeño (normalmente de hasta unos ${Math.round(S.cfg.umbral*2)} pesos), frecuente o impulsivo, no esencial y fácil de evitar: tinto, snacks, gaseosas, domicilios, propinas, taxis cortos, compras por antojo, retiros con comisión, apps. NO son hormiga: arriendo, servicios públicos, mercado grande, salud, educación, cuotas de créditos ni gastos grandes. Si se repite muchas veces en el mes (campo "veces_mes"), es más probable que sea hormiga.
Responde SOLO un JSON válido así: {"items":[{"i":0,"categoria":"...","hormiga":true,"razon":"máximo 8 palabras"}]}
GASTOS: ${JSON.stringify(items.map((g,i)=>({i,descripcion:g.desc,valor:Math.round(+g.valor||0),veces_mes:vecesMes(g.desc)})))}`;
  try{const r=await sample.json(prompt,{modelTier:'quick'});const out=(r&&r.items)||[];return out.map(x=>({i:+x.i,cat:catOf(x.categoria)?catOf(x.categoria).nombre:null,hormiga:typeof x.hormiga==='boolean'?x.hormiga:null,razon:String(x.razon||'').slice(0,80)}))}catch(e){return null}}
