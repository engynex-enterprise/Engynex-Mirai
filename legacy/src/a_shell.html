<title>Mirai Finanzas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: estilo red social (Meta) — barra superior fija, menú lateral con iconos en círculo y submenús, tarjetas blancas sobre gris, azul como único acento */
:root{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#141B2D; --muted:#5E6577; --line:#D3D7DE; --line-2:#E6E8EC; --hover:#EFF1F3; --field:#F1F2F4;
  --navy:#1F2B4B; --lime:#9EDB4E; --forest:#3F7A1E; --pri-bg:#1F2B4B; --pri-fg:#FFFFFF;
  --blue:#3F7A1E; --blue-2:#2F6116; --blue-soft:#EDF7E1; --blue-ink:#2F6116;
  --green:#3F7A1E; --green-soft:#EDF7E1; --red:#C8213B; --red-soft:#FCE8EB; --amber:#8A5A00; --amber-soft:#FEF3D6; --violet:#1F2B4B; --violet-soft:#E7EAF2;
  --shadow:0 1px 2px rgba(20,27,45,.12); --shadow-lg:0 12px 28px rgba(20,27,45,.2),0 2px 4px rgba(20,27,45,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --top:56px; color-scheme:light;
}
html.dk{
  --bg:#10151F; --card:#1A2131; --ink:#E6E9EF; --muted:#A3AABB; --line:#323B50; --line-2:#2A3245; --hover:#252D40; --field:#252D40;
  --navy:#C9D3EA; --pri-bg:#9EDB4E; --pri-fg:#1F2B4B;
  --blue:#9EDB4E; --blue-2:#B5E57A; --blue-soft:#24331C; --blue-ink:#B5E57A;
  --green:#9EDB4E; --green-soft:#24331C; --red:#F2647A; --red-soft:#3D2028; --amber:#F7B928; --amber-soft:#3A3020; --violet:#AFC0E8; --violet-soft:#273149;
  --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 12px 28px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.34;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
a{color:var(--blue-ink);text-decoration:none} a:hover{text-decoration:underline}
svg.i{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
html.priv :is(.num,.kv,.rv,.bv,.big,.metric b,.ttotal span:last-child,.ui-money input){filter:blur(7px);transition:filter .15s}
html.priv :is(.num,.kv,.rv,.bv,.big,.metric b):hover{filter:none}
.pos{color:var(--green)} .neg{color:var(--red)} .wrn{color:var(--amber)} .mut{color:var(--muted)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);background:var(--card);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-right{justify-content:flex-end}
.logo{width:40px;height:40px;border-radius:50%;background:#1F2B4B;color:#9EDB4E;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.04em;flex:none;border:0;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;height:40px;padding:0 14px;min-width:0;width:260px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);width:100%;min-width:0}
.tabs-c{display:flex;gap:4px;height:100%}
.tabs-c a{display:grid;place-items:center;width:96px;height:100%;color:var(--muted);border-bottom:3px solid transparent;position:relative;text-decoration:none}
.tabs-c a span.in{display:grid;place-items:center;width:100%;height:46px;border-radius:8px;margin-top:3px}
.tabs-c a:hover span.in{background:var(--hover)}
.tabs-c a.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs-c a.on:hover span.in{background:transparent}
.tabs-c svg.i{width:26px;height:26px}
.rbtn{width:40px;height:40px;border-radius:50%;background:var(--line-2);color:var(--ink);display:grid;place-items:center;border:0;cursor:pointer;position:relative;flex:none;padding:0}
.rbtn:hover{filter:brightness(.95)} html.dk .rbtn:hover{filter:brightness(1.2)}
.rbtn.on{background:var(--blue-soft);color:var(--blue)}
.rbtn .dot{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#E41E3F;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1F2B4B,#3F7A1E);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;border:0;cursor:pointer}
.avatar.sm{width:36px;height:36px;font-size:13px} .avatar.lg{width:84px;height:84px;font-size:30px;border:4px solid var(--card)}
.avatar.c1{background:linear-gradient(135deg,#3F7A1E,#9EDB4E)} .avatar.c2{background:linear-gradient(135deg,#C2571A,#F7B928)} .avatar.c3{background:linear-gradient(135deg,#1F2B4B,#5A6C9E)} .avatar.c4{background:linear-gradient(135deg,#2C3E6B,#3F7A1E)}
.ham{display:none}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:var(--sbw,268px) minmax(0,1fr);align-items:start;transition:grid-template-columns .2s ease}
body.sb-col{--sbw:68px}
aside.side{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line-2);padding-left:env(safe-area-inset-left,0px);min-width:0;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px}
.sb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;padding:6px;border-radius:8px;text-align:left}
.sb-brand:hover{background:var(--hover)}
.sb-logo{width:32px;height:32px;border-radius:8px;background:#1F2B4B;color:#9EDB4E;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sb-brand .sb-l b,.sb-user .sb-l b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sb-brand .sb-l small,.sb-user .sb-l small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.sb-toggle{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.sb-toggle:hover{background:var(--hover);color:var(--ink)}
.sb-toggle svg.i{width:18px;height:18px}
.sb-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.sb-body>*,.sb-sub>*{flex-shrink:0}
.sb-label{font-size:12px;font-weight:600;color:var(--muted);padding:14px 8px 6px;white-space:nowrap}
.sb-label:first-child{padding-top:4px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 8px;border-radius:8px;color:var(--ink);font:inherit;font-size:14px;font-weight:500;background:transparent;border:0;cursor:pointer;text-align:left;text-decoration:none;white-space:nowrap}
.sb-item:hover{background:var(--hover);text-decoration:none}
.sb-item.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.sb-ic{width:22px;height:22px;display:grid;place-items:center;flex:none;color:var(--muted)}
.sb-ic svg.i{width:18px;height:18px}
.sb-item.on .sb-ic{color:var(--blue)}
.sb-chev{color:var(--muted);display:grid;transition:transform .2s;flex:none}
.sb-chev svg.i{width:16px;height:16px}
.sb-item.open .sb-chev{transform:rotate(90deg)}
.sb-bdg{background:#E41E3F;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;flex:none}
.sb-bdg.info{background:var(--lime);color:#1F2B4B}
.sb-sub{display:none;flex-direction:column;gap:1px;margin:2px 0 4px 18px;padding-left:10px;border-left:1px solid var(--line)}
.sb-sub.open{display:flex}
.sb-sub a{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;color:var(--muted);font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.sb-sub a:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.sb-sub a.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.sb-sub a .sb-bdg{margin-left:auto}
.sb-foot{border-top:1px solid var(--line-2);padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px}
.sb-sync{display:flex;flex-direction:column;gap:2px;padding:4px 8px;font-size:12.5px}
.sb-user{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:8px;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.sb-user:hover{background:var(--hover)}
.sb-chev2{color:var(--muted);display:grid}.sb-chev2 svg.i{width:16px;height:16px}
body.sb-col .sb-l,body.sb-col .sb-chev,body.sb-col .sb-chev2,body.sb-col .sb-label,body.sb-col .sb-sub,body.sb-col .sb-item .sb-bdg{display:none}
body.sb-col .sb-head{flex-direction:column;padding:12px 8px 6px}
body.sb-col .sb-body{padding:4px 8px}
body.sb-col .sb-item{justify-content:center;padding:0;height:40px;position:relative}
body.sb-col .sb-item .sb-ic svg.i{width:20px;height:20px}
body.sb-col .sb-body>.sb-item:not(:first-child){margin-top:2px}
body.sb-col .sb-foot{padding:8px}
body.sb-col .sb-sync{align-items:center;padding:4px 0}
body.sb-col .sb-sync .syncp{font-size:0;gap:0}
body.sb-col .sb-user{justify-content:center;padding:4px}
body.sb-col .sb-brand{justify-content:center;padding:4px}
.flyout{padding:6px;min-width:220px}
.flyout .fh{font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px 4px}
.umenu{width:280px;padding:6px}
.umenu .uh{display:flex;gap:10px;align-items:center;padding:10px}
.umenu .uh b{display:block}
.umenu hr{border:0;border-top:1px solid var(--line-2);margin:6px 0}
.umenu .opt.danger{color:var(--red)} .umenu .opt.danger .oi{background:var(--red-soft);color:var(--red)}
.kbd{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.syncp{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.syncp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncp.cloud::before{background:var(--green)} .syncp.local::before{background:#F7B928} .syncp.err::before{background:var(--red)}
main{min-width:0;padding-block:20px 64px;padding-left:max(16px,2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2vw);display:flex;flex-direction:column;gap:16px;max-width:1180px;width:100%}

/* ---------- tipografía y bloques ---------- */
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-h .pic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.page-h .pic svg.i{width:26px;height:26px}
.page-h h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:14.5px;max-width:72ch}
.page-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:17px;font-weight:700}
.card h3{margin:0;font-size:15px;font-weight:700}
.card .sub-t{color:var(--muted);font-size:13px}
.lbl-s{font-size:12.5px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.kpi{flex-direction:row;align-items:center;gap:12px}
.kpi .ki{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .kv{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .ks{font-size:12.5px;color:var(--muted)}
.kpi>div{min-width:0}
.t-blue{background:var(--blue-soft);color:var(--blue)} .t-green{background:var(--green-soft);color:var(--green)} .t-red{background:var(--red-soft);color:var(--red)} .t-amber{background:var(--amber-soft);color:var(--amber)} .t-violet{background:var(--violet-soft);color:var(--violet)} .t-gray{background:var(--line-2);color:var(--muted)}
.b-blue{background:#1F2B4B} .b-green{background:#3F7A1E} .b-red{background:#C8213B} .b-amber{background:#D98300} .b-violet{background:#3B4C7C} .b-teal{background:#5E9A2C} .b-pink{background:#2C3E6B} .b-gray{background:#5E6577} .b-grad{background:linear-gradient(135deg,#1F2B4B,#3F7A1E 70%,#9EDB4E)}
.note{font-size:13px;color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.info{background:var(--blue-soft);color:var(--blue-ink)} .pill.gray{background:var(--line-2);color:var(--muted)} .pill.vio{background:var(--violet-soft);color:var(--violet)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:14px;padding:28px 16px}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--muted)}
.empty .ei svg.i{width:28px;height:28px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px;height:36px;padding:0 14px;border-radius:6px;border:0;cursor:pointer;background:var(--line-2);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.96);text-decoration:none} html.dk .btn:hover{filter:brightness(1.15)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg)}
.btn.soft{background:var(--blue-soft);color:var(--blue-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;font-size:13.5px;padding:0 10px}
.btn.lg{height:44px;font-size:16px;padding:0 20px}
.btn.icon{width:36px;padding:0} .btn.icon.sm{width:30px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ai{background:linear-gradient(135deg,#1F2B4B,#3F7A1E);color:#fff}

/* ---------- campos estilo shadcn ---------- */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.fl{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.f .hint{font-size:12.5px;color:var(--muted);font-weight:400}
.inp,.ui-trigger,.ui-money{height:40px;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:0 12px;display:flex;align-items:center;gap:8px;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.inp:focus,.ui-trigger:focus-visible,.ui-trigger.open,.ui-money:focus-within{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.inp::placeholder,.ui-money input::placeholder{color:var(--muted);opacity:.8}
.ui-trigger{cursor:pointer;text-align:left;justify-content:space-between}
.ui-trigger .tv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ui-trigger .tv.ph{color:var(--muted)}
.ui-trigger>svg.i{color:var(--muted);width:18px;height:18px}
.ui-money{padding:0 0 0 12px;gap:4px}
.ui-money .cur{color:var(--muted);font-weight:600;font-size:14px;flex:none}
.ui-money input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);height:100%;width:100%;min-width:0;padding-right:12px;font-variant-numeric:tabular-nums;font-weight:600}
.f.err .inp,.f.err .ui-trigger,.f.err .ui-money{border-color:var(--red)}
.chk{appearance:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;background:var(--card);display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.chk:checked{background:var(--forest);border-color:var(--forest)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.switch{appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.switch:checked{background:var(--blue)} .switch:checked::after{left:19px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;align-items:end}
.form .full{grid-column:1/-1}
.form .s2{grid-column:span 2}
.seg{display:inline-flex;background:var(--field);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:6px 12px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.choice{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--card);text-align:left;font:inherit;color:var(--ink)}
.choice:hover{border-color:var(--muted)}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice .ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.choice b{display:block;font-size:14.5px;margin-bottom:2px}
.choice span{font-size:13px;color:var(--muted);line-height:1.35}
.choice .rec{position:absolute;top:-9px;right:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-fg)}
.tip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line-2);color:var(--muted);font-size:11px;font-weight:700;cursor:help;position:relative}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:260px;background:#1C1E21;color:#fff;font-size:12.5px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:60;white-space:normal;box-shadow:var(--shadow-lg)}

/* ---------- popovers (select / calendario / menús) ---------- */
#pop{position:fixed;z-index:70;background:var(--card);border-radius:10px;box-shadow:var(--shadow-lg);border:1px solid var(--line-2);min-width:200px;max-width:min(380px,calc(100vw - 24px));overflow:hidden}
.pop-list{max-height:300px;overflow-y:auto;padding:6px}
.pop-search{padding:8px;border-bottom:1px solid var(--line-2)}
.pop-search input{width:100%;height:34px;border:0;background:var(--field);border-radius:6px;padding:0 10px;font:inherit;color:var(--ink);outline:0}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14.5px}
.opt:hover,.opt.act{background:var(--hover)}
.opt.sel{font-weight:600}
.opt .ck{margin-left:auto;color:var(--blue)}
.opt .oh{display:block;font-size:12px;color:var(--muted);font-weight:400}
.opt .oi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line-2);color:var(--ink)}
.opt .oi svg.i{width:16px;height:16px}
.opt-empty{padding:12px;color:var(--muted);font-size:13.5px}
.cal{padding:12px;width:292px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:15px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 0}
.cal-g button{border:0;background:transparent;height:36px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.cal-g button:hover{background:var(--hover)}
.cal-g button.o{color:var(--muted);opacity:.5}
.cal-g button.t{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);font-weight:700}
.cal-g button.s{background:var(--pri-bg);color:var(--pri-fg);font-weight:700}
.cal-f{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.menu{padding:6px;min-width:240px}
.menu .opt svg.i{color:var(--muted)}

/* ---------- tablas y listas ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap} td.nw{white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line-2)}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--hover)}
tr.done td{color:var(--muted)}
tr.next td{background:var(--blue-soft)}
.rowi{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;min-width:0}
.rowi:hover{background:var(--hover)}
.rowi .ri{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.rowi .rb{flex:1;min-width:0}
.rowi .rt{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .rs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rowi .rv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rowi .ra{display:flex;gap:6px;align-items:center}
.list{display:flex;flex-direction:column;margin:0 -8px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:5px;font-size:14px}
.bar .bh{display:flex;justify-content:space-between;gap:10px}
.bar .bh span:first-child{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.track.lg{height:12px;border-radius:6px} .track.lg i{border-radius:6px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;font-size:14px}
.alert{flex-wrap:wrap} .alert>div{flex:1;min-width:min(100%,220px)}
.alert .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.alert b{display:block;margin-bottom:2px}
.alert.bad{background:var(--red-soft)} .alert.bad .ai{background:var(--red);color:#fff}
.alert.warn{background:var(--amber-soft)} .alert.warn .ai{background:#E08A00;color:#fff}
.alert.ok{background:var(--green-soft)} .alert.ok .ai{background:var(--green);color:#fff}
.alert.info{background:var(--blue-soft)} .alert.info .ai{background:var(--blue);color:#fff}
.datebox{width:46px;text-align:center;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line-2);flex:none;line-height:1.05}
.datebox span{display:block;background:#1F2B4B;color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 0}
.datebox b{display:block;font-size:18px;padding:3px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto;margin:0 -16px;padding:0 12px}
.tabs button{border:0;background:transparent;font:inherit;font-weight:600;font-size:14.5px;color:var(--muted);padding:12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.composer{flex-direction:row;align-items:center;gap:10px}
.composer .cp{flex:1;height:40px;border-radius:999px;background:var(--field);border:0;text-align:left;padding:0 16px;font:inherit;color:var(--muted);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer .cp:hover{filter:brightness(.97)}
.quick{display:flex;gap:4px;border-top:1px solid var(--line-2);padding-top:8px;margin-top:-2px;flex-wrap:wrap}
.quick button{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;font:inherit;font-weight:600;font-size:14.5px;color:var(--muted);height:40px;border-radius:8px;cursor:pointer}
.quick button:hover{background:var(--hover)}

/* ---------- T contable ---------- */
.taccount{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--ink)}
.taccount>div{padding:12px 14px;min-width:0}
.taccount>div:first-child{border-right:3px solid var(--ink)}
.taccount h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.tline{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.tline .ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.tline .ti svg.i{width:16px;height:16px}
.tline .tn{min-width:0}
.tline .tn small{display:block;color:var(--muted);font-size:12px}
.ttotal{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid var(--ink);font-weight:700}
.band{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 16px;border-radius:10px;background:var(--blue-soft)}
.band .bv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- consejero ---------- */
.ai-card{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#1F2B4B,#9EDB4E) border-box}
.verdict{display:flex;gap:14px;align-items:center;padding:16px;border-radius:12px}
.verdict .vi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.verdict .vi svg.i{width:30px;height:30px}
.verdict h2{font-size:20px}
.verdict.si{background:var(--green-soft)} .verdict.si .vi{background:var(--green)}
.verdict.cuidado{background:var(--amber-soft)} .verdict.cuidado .vi{background:#E08A00}
.verdict.no{background:var(--red-soft)} .verdict.no .vi{background:var(--red)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line-2),var(--hover),var(--line-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.metric{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--field)}
.metric b{font-size:16px;font-variant-numeric:tabular-nums}
.metric span{font-size:12.5px;color:var(--muted)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* ---------- modal, notificaciones ---------- */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(244,244,244,.8);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
html.dk #modal{background:rgba(0,0,0,.6)}
#modal.show{display:flex}
.dlg{background:var(--card);border-radius:10px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(820px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 56px;border-bottom:1px solid var(--line-2);min-height:60px}
.dlg-h h2{margin:0;font-size:19px;font-weight:700;text-align:center}
.dlg-h .rbtn{position:absolute;right:14px;top:10px}
.dlg-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.step{display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
.step-h .n{width:26px;height:26px;border-radius:50%;background:var(--lime);color:#1F2B4B;display:grid;place-items:center;font-size:13px;flex:none}
.preview{border-radius:10px;background:var(--blue-soft);border-left:4px solid var(--lime);padding:14px;display:flex;flex-direction:column;gap:8px}
.preview .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.npanel{width:min(380px,calc(100vw - 24px))}
.npanel .nh{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 6px}
.npanel .nh h2{margin:0;font-size:22px}
.nlist{max-height:min(520px,70vh);overflow-y:auto;padding:4px 6px 8px}
.nitem{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;align-items:flex-start;text-decoration:none;color:var(--ink)}
.nitem:hover{background:var(--hover);text-decoration:none}
.nitem .ni{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.nitem .nb{flex:1;min-width:0;font-size:14px}
.nitem .nb small{display:block;font-size:12.5px;color:var(--blue-ink);font-weight:600;margin-top:2px}
.nitem.read .nb small{color:var(--muted);font-weight:400}
.nitem .nd{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none;align-self:center}
#toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:tin .25s ease-out}
.toast .ni{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.toast .tb{flex:1;min-width:0}
.toast b{display:block}
.toast.simple{background:#1C1E21;color:#fff;align-items:center;padding:10px 14px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#scrim{display:none}

@media (max-width:1180px){.tabs-c a{width:72px}.search{width:200px}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.tabs-c{display:none}.topbar{grid-template-columns:minmax(0,1fr) auto}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .ham{display:grid}
  aside.side{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(320px,86vw);background:var(--card);z-index:45;box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform .22s}
  body.sb-col .sb-l,body.sb-col .sb-label,body.sb-col .sb-chev,body.sb-col .sb-chev2{display:revert} body.sb-col .sb-sub.open{display:flex} body.sb-col .sb-item{justify-content:flex-start;padding:0 8px} .sb-toggle{display:none}
  body.nav-open aside.side{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35)}
  .search{width:auto;flex:1}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form .s2{grid-column:auto}
  .taccount{grid-template-columns:minmax(0,1fr)}
  .taccount>div:first-child{border-right:0;border-bottom:3px solid var(--ink)}
}
@media (max-width:520px){#privBtn{display:none}.g4{grid-template-columns:minmax(0,1fr)}.search{display:none}.page-h .act{margin-left:0;width:100%}.dlg-b{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- encabezado estilo shadcn ---------- */
.topbar{display:flex!important;justify-content:space-between;align-items:center;gap:12px;height:var(--top);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);box-shadow:none!important}
.tb-left{flex:1;min-width:0}
.tb-sep{width:1px;height:18px;background:var(--line);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs svg.i{width:14px;height:14px;flex:none}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;padding:0;transition:background .15s}
.ib:hover{background:var(--hover)}
.ib svg.i{width:18px;height:18px}
.ib .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E41E3F;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.topbar .search{height:36px;width:260px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:0 8px 0 10px;gap:8px}
.topbar .search svg.i{width:16px;height:16px}
.topbar .search .kbd{margin-left:0;white-space:nowrap}
.topbar .search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.pic.isop{background:none!important;width:56px;height:56px} .pic.isop svg{width:56px;height:56px}
.sb-ic svg.isoi{width:22px;height:22px}
.sb-sub a svg.isoi{width:18px;height:18px;flex:none}
.sb-logo.isol{background:none;width:34px;height:34px} .sb-logo.isol svg{width:34px;height:34px}
.help-btn{border:1px solid var(--line)!important}
#tour{position:fixed;inset:0;z-index:90;pointer-events:none}
.tour-ring{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,20,35,.55),0 0 0 3px #9EDB4E;transition:all .25s ease}
.tour-card{position:fixed;background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);padding:16px;pointer-events:auto;border:1px solid var(--line-2)}
@media (max-width:900px){.topbar .search{width:180px}.topbar .search .kbd{display:none}}
@media (max-width:640px){.topbar .search,#privBtn,.tb-sep{display:none}.crumbs .mid{display:none}}

/* ---------- acceso ---------- */
body.locked .shell,body.locked .topbar{visibility:hidden}
#auth{position:fixed;inset:0;z-index:85;background:var(--bg);overflow-y:auto}
.auth-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{position:relative;overflow:hidden;background:linear-gradient(150deg,#1F2B4B 0%,#22394F 45%,#2E5B33 100%);color:#fff;padding:36px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.ab-top{display:flex;align-items:center;gap:10px;font-size:22px}
.ab-top b{letter-spacing:-.02em}
.ab-mid{max-width:440px;margin:auto 0;position:relative;z-index:1}
.ab-mid h2{font-size:34px;line-height:1.15;margin:0 0 24px;letter-spacing:-.02em;text-wrap:balance}
.ab-feats{display:flex;flex-direction:column;gap:14px}
.ab-feats div{display:flex;align-items:center;gap:12px;font-size:16px;opacity:.95}
.ab-iso{position:absolute;right:32px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,72px);gap:18px;opacity:.9}
.ab-iso span{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.08);display:grid;place-items:center;animation:abf 6s ease-in-out infinite;animation-delay:calc(var(--k)*-1s)}
@keyframes abf{50%{transform:translateY(-8px)}}
.ab-foot{font-size:12.5px;opacity:.75;margin:0;display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px 16px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.a-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.a-head h1{margin:4px 0 0;font-size:26px;letter-spacing:-.02em}
.a-head p{margin:0;color:var(--muted);font-size:14.5px;max-width:36ch}
.a-foot{text-align:center;font-size:14px;margin:0;color:var(--muted)}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw-eye{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{background:var(--hover)}
.pw-meter{display:flex;flex-direction:column;gap:6px;margin-top:-6px}
.pw-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pw-bars i{height:5px;border-radius:3px;background:var(--line-2)}
.pw-req{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.pw-req li{display:flex;gap:6px;align-items:center}.pw-req li svg.i{width:14px;height:14px}.pw-req li.ok{color:var(--green)}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:54px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;font:inherit;font-size:22px;font-weight:700}
.otp input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.a-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line-2);border-radius:12px;background:var(--card)}
#qr{width:168px;height:168px;display:grid;place-items:center;background:#fff;border-radius:8px;padding:0}
#qr img,#qr canvas{display:block}
.qrbox>div:last-child{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px}
.secret{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--field);padding:8px;border-radius:6px;word-break:break-all}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codes code{font-family:ui-monospace,Menlo,monospace;font-size:15px;text-align:center;padding:10px;border-radius:8px;background:var(--field);letter-spacing:.08em}
.step-ok{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.step-ok svg.i{width:12px;height:12px}
@media (max-width:1100px){.ab-iso{display:none}}

:root{--bg:#F5F5F5;--card:#FFFFFF;--ink:#242424;--muted:#616161;--line:#D1D1D1;--line-2:#E0E0E0;--hover:#F0F0F0;--field:#FFFFFF;--nav:#FAFAFA;--navsel:#EBEBEB;--top:48px;

/* panel de navegación */
